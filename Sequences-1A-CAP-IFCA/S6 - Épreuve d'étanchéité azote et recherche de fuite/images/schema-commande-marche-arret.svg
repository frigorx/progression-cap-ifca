<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1b3a63">Schéma de commande — marche/arrêt, auto-maintien, sécurité thermique, voyants</text>

  <!-- ===== rails Ph / N ===== -->
  <line x1="60" y1="55" x2="580" y2="55" stroke="#a4321e" stroke-width="2.5"/>
  <line x1="60" y1="430" x2="580" y2="430" stroke="#1f5fa8" stroke-width="2.5"/>
  <text x="32" y="59" font-size="11" fill="#333">Ph</text>
  <text x="34" y="434" font-size="11" fill="#333">N</text>

  <!-- ===== RUNG A : F1(95-96) - S2(arrêt) - [S1(marche) // KM1 13-14] - KM1 (bobine) ===== -->
  <line x1="160" y1="55" x2="160" y2="90" stroke="#a4321e" stroke-width="2"/>

  <!-- F1 95-96 (NF) -->
  <circle cx="160" cy="90" r="2.2" fill="#000"/>
  <circle cx="160" cy="150" r="2.2" fill="#000"/>
  <line x1="160" y1="90" x2="160" y2="100" stroke="#000" stroke-width="1.2"/>
  <line x1="160" y1="100" x2="170" y2="120" stroke="#000" stroke-width="1.2"/>
  <line x1="163" y1="120" x2="177" y2="120" stroke="#000" stroke-width="1.2"/>
  <line x1="160" y1="140" x2="160" y2="150" stroke="#000" stroke-width="1.2"/>
  <text x="176" y="98" font-size="10" font-weight="bold" fill="#1b3a63">F1</text>
  <text x="139" y="86" font-size="8" fill="#5d6b7c">95</text>
  <text x="139" y="158" font-size="8" fill="#5d6b7c">96</text>
  <text x="176" y="132" font-size="8" fill="#5d6b7c" font-style="italic">NF</text>

  <line x1="160" y1="150" x2="160" y2="170" stroke="#a4321e" stroke-width="2"/>

  <!-- S2 arrêt (NF) -->
  <circle cx="160" cy="170" r="2.2" fill="#000"/>
  <circle cx="160" cy="230" r="2.2" fill="#000"/>
  <line x1="160" y1="170" x2="160" y2="180" stroke="#000" stroke-width="1.2"/>
  <line x1="160" y1="180" x2="170" y2="200" stroke="#000" stroke-width="1.2"/>
  <line x1="163" y1="200" x2="177" y2="200" stroke="#000" stroke-width="1.2"/>
  <line x1="160" y1="220" x2="160" y2="230" stroke="#000" stroke-width="1.2"/>
  <text x="176" y="178" font-size="10" font-weight="bold" fill="#1b3a63">S2</text>
  <text x="176" y="192" font-size="8" fill="#5d6b7c">(arrêt)</text>
  <text x="176" y="206" font-size="8" fill="#5d6b7c" font-style="italic">NF</text>

  <!-- noeud P1 -> split -->
  <line x1="160" y1="230" x2="110" y2="230" stroke="#a4321e" stroke-width="2"/>
  <line x1="160" y1="230" x2="210" y2="230" stroke="#a4321e" stroke-width="2"/>

  <!-- branche S1 marche (NO) -->
  <line x1="110" y1="230" x2="110" y2="240" stroke="#a4321e" stroke-width="2"/>
  <circle cx="110" cy="240" r="2.2" fill="#000"/>
  <circle cx="110" cy="300" r="2.2" fill="#000"/>
  <line x1="110" y1="240" x2="110" y2="250" stroke="#000" stroke-width="1.2"/>
  <line x1="110" y1="250" x2="120" y2="270" stroke="#000" stroke-width="1.2"/>
  <line x1="110" y1="290" x2="110" y2="300" stroke="#000" stroke-width="1.2"/>
  <text x="128" y="248" font-size="10" font-weight="bold" fill="#1b3a63">S1</text>
  <text x="128" y="262" font-size="8" fill="#5d6b7c">(marche)</text>
  <text x="128" y="276" font-size="8" fill="#5d6b7c" font-style="italic">NO</text>

  <!-- branche KM1 13-14 (NO, auto-maintien) -->
  <line x1="210" y1="230" x2="210" y2="240" stroke="#a4321e" stroke-width="2"/>
  <circle cx="210" cy="240" r="2.2" fill="#000"/>
  <circle cx="210" cy="290" r="2.2" fill="#000"/>
  <line x1="210" y1="240" x2="210" y2="250" stroke="#000" stroke-width="1.2"/>
  <line x1="210" y1="250" x2="220" y2="270" stroke="#000" stroke-width="1.2"/>
  <line x1="210" y1="280" x2="210" y2="290" stroke="#000" stroke-width="1.2"/>
  <line x1="210" y1="290" x2="210" y2="300" stroke="#a4321e" stroke-width="2"/>
  <text x="228" y="238" font-size="10" font-weight="bold" fill="#1b3a63">KM1</text>
  <text x="228" y="252" font-size="7.5" fill="#5d6b7c">(13-14, auto-maintien)</text>
  <text x="228" y="266" font-size="8" fill="#5d6b7c" font-style="italic">NO</text>

  <!-- merge P2 -->
  <line x1="110" y1="300" x2="160" y2="300" stroke="#a4321e" stroke-width="2"/>
  <line x1="210" y1="300" x2="160" y2="300" stroke="#a4321e" stroke-width="2"/>

  <line x1="160" y1="300" x2="160" y2="320" stroke="#a4321e" stroke-width="2"/>

  <!-- bobine KM1 -->
  <circle cx="160" cy="320" r="2.2" fill="#000"/>
  <circle cx="160" cy="360" r="2.2" fill="#000"/>
  <line x1="160" y1="320" x2="160" y2="328" stroke="#000" stroke-width="1.2"/>
  <rect x="146" y="328" width="28" height="24" fill="#f5f8fc" stroke="#000" stroke-width="1.3"/>
  <line x1="160" y1="352" x2="160" y2="360" stroke="#000" stroke-width="1.2"/>
  <text x="178" y="336" font-size="10" font-weight="bold" fill="#1b3a63">KM1</text>
  <text x="178" y="350" font-size="8" fill="#5d6b7c">(bobine)</text>
  <text x="127" y="324" font-size="8" fill="#5d6b7c">A1</text>
  <text x="127" y="356" font-size="8" fill="#5d6b7c">A2</text>

  <line x1="160" y1="360" x2="160" y2="430" stroke="#a4321e" stroke-width="2"/>

  <!-- liaison mécanique KM1 (bobine <-> contact 13-14) -->
  <line x1="174" y1="340" x2="230" y2="340" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="230" y1="340" x2="230" y2="270" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="230" y1="270" x2="220" y2="270" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <text x="234" y="400" font-size="7.5" fill="#5d6b7c" font-style="italic">même contacteur KM1</text>

  <!-- ===== RUNG B : H1 voyant marche (en parallèle de la bobine) ===== -->
  <line x1="160" y1="300" x2="320" y2="300" stroke="#a4321e" stroke-width="2"/>
  <line x1="320" y1="300" x2="320" y2="324" stroke="#a4321e" stroke-width="2"/>
  <circle cx="320" cy="340" r="16" fill="#3f9142" stroke="#000" stroke-width="1.3"/>
  <line x1="312" y1="332" x2="328" y2="348" stroke="#fff" stroke-width="1.4"/>
  <line x1="312" y1="348" x2="328" y2="332" stroke="#fff" stroke-width="1.4"/>
  <line x1="320" y1="356" x2="320" y2="430" stroke="#a4321e" stroke-width="2"/>
  <text x="342" y="336" font-size="10" font-weight="bold" fill="#1b3a63">H1</text>
  <text x="342" y="350" font-size="8" fill="#5d6b7c">(vert — marche)</text>

  <!-- ===== RUNG C : F1 97-98 (NO) + H2 voyant défaut, alimenté directement depuis Ph ===== -->
  <line x1="460" y1="55" x2="460" y2="90" stroke="#a4321e" stroke-width="2"/>
  <circle cx="460" cy="90" r="2.2" fill="#000"/>
  <circle cx="460" cy="150" r="2.2" fill="#000"/>
  <line x1="460" y1="90" x2="460" y2="100" stroke="#000" stroke-width="1.2"/>
  <line x1="460" y1="100" x2="470" y2="120" stroke="#000" stroke-width="1.2"/>
  <line x1="460" y1="140" x2="460" y2="150" stroke="#000" stroke-width="1.2"/>
  <text x="476" y="98" font-size="10" font-weight="bold" fill="#1b3a63">F1</text>
  <text x="476" y="112" font-size="8" fill="#5d6b7c">(97-98)</text>
  <text x="476" y="126" font-size="8" fill="#5d6b7c" font-style="italic">NO</text>

  <line x1="460" y1="150" x2="460" y2="184" stroke="#a4321e" stroke-width="2"/>
  <circle cx="460" cy="200" r="16" fill="#c0392b" stroke="#000" stroke-width="1.3"/>
  <line x1="452" y1="192" x2="468" y2="208" stroke="#fff" stroke-width="1.4"/>
  <line x1="452" y1="208" x2="468" y2="192" stroke="#fff" stroke-width="1.4"/>
  <line x1="460" y1="216" x2="460" y2="430" stroke="#a4321e" stroke-width="2"/>
  <text x="482" y="196" font-size="10" font-weight="bold" fill="#1b3a63">H2</text>
  <text x="482" y="210" font-size="8" fill="#5d6b7c">(rouge — défaut)</text>

  <!-- liaison mécanique F1 (même relais thermique, deux contacts) -->
  <line x1="176" y1="120" x2="456" y2="120" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <text x="220" y="112" font-size="7.5" fill="#5d6b7c" font-style="italic">F1 — même relais thermique (95-96 coupe la bobine · 97-98 signale le défaut)</text>

  <!-- légende -->
  <g transform="translate(20,450)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase</text>
    <line x1="90" y1="-4" x2="110" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="114" y="-1">Neutre</text>
    <text x="190" y="-1">NO = normalement ouvert</text>
    <text x="330" y="-1">NF = normalement fermé</text>
    <line x1="450" y1="-4" x2="470" y2="-4" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/><text x="474" y="-1">liaison mécanique (même appareil)</text>
  </g>
</svg>
