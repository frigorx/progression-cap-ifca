<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1b3a63">Schéma réduit, sans repères — départ moteur en démarrage direct</text>

  <text x="20" y="50" font-size="10" font-weight="bold" fill="#5d6b7c">PARTIE PUISSANCE</text>
  <g stroke="#a4321e" stroke-width="2">
    <line x1="40" y1="80" x2="140" y2="80"/>
    <line x1="40" y1="110" x2="140" y2="110"/>
    <line x1="40" y1="140" x2="140" y2="140"/>
    <line x1="190" y1="80" x2="290" y2="80"/>
    <line x1="190" y1="110" x2="290" y2="110"/>
    <line x1="190" y1="140" x2="290" y2="140"/>
    <line x1="340" y1="80" x2="440" y2="80"/>
    <line x1="340" y1="110" x2="440" y2="110"/>
    <line x1="340" y1="140" x2="440" y2="140"/>
    <line x1="490" y1="80" x2="600" y2="80"/>
    <line x1="490" y1="110" x2="600" y2="110"/>
    <line x1="490" y1="140" x2="600" y2="140"/>
  </g>
  <g stroke="#a4321e" stroke-width="2">
    <line x1="600" y1="80" x2="660" y2="80"/>
    <line x1="600" y1="110" x2="660" y2="110"/>
    <line x1="600" y1="140" x2="660" y2="140"/>
    <line x1="660" y1="80" x2="660" y2="205"/>
    <line x1="640" y1="110" x2="640" y2="225"/>
    <line x1="620" y1="140" x2="620" y2="245"/>
  </g>

  <!-- Q1 — sectionneur 3P, sans repères -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="140" cy="80" r="1.8" fill="#000"/><line x1="140" y1="80" x2="178" y2="60"/><circle cx="190" cy="80" r="1.8" fill="#000"/>
    <circle cx="140" cy="110" r="1.8" fill="#000"/><line x1="140" y1="110" x2="178" y2="90"/><circle cx="190" cy="110" r="1.8" fill="#000"/>
    <circle cx="140" cy="140" r="1.8" fill="#000"/><line x1="140" y1="140" x2="178" y2="120"/><circle cx="190" cy="140" r="1.8" fill="#000"/>
    <line x1="163" y1="70" x2="163" y2="150" stroke-width="0.6" stroke-dasharray="4,3"/>
  </g>
  <text x="150" y="42" font-size="12" fill="#9aa5b1">?</text>

  <!-- KM1 — contacts de puissance 3P, sans repères -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="290" cy="80" r="1.8" fill="#000"/><polyline points="290,80 300,60 302,50"/><circle cx="340" cy="80" r="1.8" fill="#000"/>
    <circle cx="290" cy="110" r="1.8" fill="#000"/><polyline points="290,110 300,90 302,80"/><circle cx="340" cy="110" r="1.8" fill="#000"/>
    <circle cx="290" cy="140" r="1.8" fill="#000"/><polyline points="290,140 300,120 302,110"/><circle cx="340" cy="140" r="1.8" fill="#000"/>
    <line x1="313" y1="70" x2="313" y2="150" stroke-width="0.6" stroke-dasharray="4,3"/>
  </g>
  <text x="295" y="42" font-size="12" fill="#9aa5b1">?</text>

  <!-- F1 — relais thermique, sans repères -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="440" cy="80" r="1.8" fill="#000"/><line x1="440" y1="80" x2="475" y2="80"/><polyline points="475,74 481,80 475,86 481,92" stroke-width="1"/><circle cx="490" cy="80" r="1.8" fill="#000"/>
    <circle cx="440" cy="110" r="1.8" fill="#000"/><line x1="440" y1="110" x2="475" y2="110"/><polyline points="475,104 481,110 475,116 481,122" stroke-width="1"/><circle cx="490" cy="110" r="1.8" fill="#000"/>
    <circle cx="440" cy="140" r="1.8" fill="#000"/><line x1="440" y1="140" x2="475" y2="140"/><polyline points="475,134 481,140 475,146 481,152" stroke-width="1"/><circle cx="490" cy="140" r="1.8" fill="#000"/>
    <rect x="465" y="66" width="30" height="90" fill="none" stroke-width="0.6" stroke-dasharray="4,3"/>
  </g>
  <text x="450" y="42" font-size="12" fill="#9aa5b1">?</text>

  <!-- M1 — moteur, sans repères -->
  <g transform="translate(660,235)" stroke="#000" stroke-width="1" fill="none">
    <ellipse cx="0" cy="0" rx="30" ry="30"/>
    <text x="-12" y="6" font-family="'Trebuchet MS',sans-serif" font-size="16" font-weight="bold" fill="#000">M</text>
    <text x="-6" y="20" font-size="11" fill="#000">3~</text>
  </g>
  <text x="700" y="228" font-size="12" fill="#9aa5b1">?</text>

  <line x1="0" y1="290" x2="960" y2="290" stroke="#d8dee6" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="20" y="310" font-size="10" font-weight="bold" fill="#5d6b7c">PARTIE COMMANDE</text>

  <g stroke="#7b5cf5" stroke-width="2">
    <line x1="40" y1="345" x2="120" y2="345"/>
    <line x1="170" y1="345" x2="280" y2="345"/>
    <line x1="330" y1="345" x2="430" y2="345"/>
    <line x1="480" y1="345" x2="560" y2="345"/>
    <line x1="560" y1="345" x2="560" y2="400"/>
    <line x1="40" y1="430" x2="560" y2="430"/>
    <line x1="560" y1="430" x2="560" y2="400"/>
  </g>

  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="120" cy="345" r="1.8" fill="#000"/>
    <line x1="113" y1="345" x2="129" y2="345" stroke-width="0.5" stroke-dasharray="4,2"/>
    <polyline points="120,335 130,341 120,347 130,353"/>
    <circle cx="170" cy="345" r="1.8" fill="#000"/>
  </g>
  <text x="105" y="322" font-size="11" fill="#9aa5b1">?</text>

  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="280" cy="345" r="1.8" fill="#000"/>
    <line x1="280" y1="345" x2="315" y2="325"/>
    <circle cx="330" cy="345" r="1.8" fill="#000"/>
  </g>
  <text x="290" y="322" font-size="11" fill="#9aa5b1">?</text>

  <g stroke="#000" stroke-width="1" fill="none">
    <line x1="430" y1="345" x2="480" y2="345"/>
    <rect x="480" y="330" width="45" height="30"/>
    <line x1="525" y1="345" x2="560" y2="345"/>
  </g>
  <text x="480" y="322" font-size="11" fill="#9aa5b1">?</text>

  <text x="20" y="452" font-size="9" font-style="italic" fill="#5d6b7c">À vous de compléter les repères (Q1, KM1, F1, M1, S1) et les numéros de bornes sur le schéma légendé de l'annexe.</text>
</svg>
