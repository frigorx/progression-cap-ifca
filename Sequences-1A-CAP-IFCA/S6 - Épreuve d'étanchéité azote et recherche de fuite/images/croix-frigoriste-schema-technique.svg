<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" style="width:100%; background:#fff; border:1px solid #d8dee6; border-radius:4px">
<style>
  .lib{font-family:'Trebuchet MS',Arial,sans-serif; font-size:16px; font-weight:bold; fill:#1b3a63}
  .sub{font-family:Arial,sans-serif; font-size:11px; fill:#5d6b7c}
  .tube-hp{stroke:#ff6b35; stroke-width:2.5; fill:none}
  .tube-bp{stroke:#1b3a63; stroke-width:2.5; fill:none; stroke-dasharray:6,4}
  .fleche{fill:#ff6b35}
  .cadre{fill:none; stroke:#d8dee6; stroke-width:1}
</style>
<text x="450" y="28" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1b3a63">La Croix du Frigoriste — schéma de principe du circuit frigorifique</text>
<text class="sub" x="450" y="46" text-anchor="middle">Condenseur en HAUT · Évaporateur en BAS · Détendeur à GAUCHE · Compresseur à DROITE</text>

<!-- CONDENSEUR (haut, centre) — échangeur à air -->
<rect class="cadre" x="330" y="55" width="240" height="150"/>
<g transform="translate(450,125) scale(3.0)"><line x1="6" y1="-5" x2="6" y2="14" stroke="#000" stroke-width="0.5"/>
<line x1="10" y1="-5.82667" x2="10" y2="-10.16" stroke="#000" stroke-width="1"/>
<line x1="0.5" y1="-5" x2="0.5" y2="14" stroke="#000" stroke-width="0.5"/>
<rect x="-16" y="-5" width="30" height="20" fill="none" stroke="#000" stroke-width="1"/>
<line x1="10" y1="20" x2="10" y2="15" stroke="#000" stroke-width="1"/>
<line x1="-10" y1="20.1359" x2="-10" y2="15.8746" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="-5" x2="-7" y2="14" stroke="#000" stroke-width="0.5"/>
<line x1="-12" y1="-5" x2="10" y2="15" stroke="#000" stroke-width="1"/>
<line x1="10" y1="-5" x2="-12" y2="15" stroke="#000" stroke-width="1"/>
<line x1="-10" y1="-5" x2="-10" y2="-10" stroke="#000" stroke-width="1"/>
<circle cx="-10" cy="-10" r="1.5" fill="#000"/>
<circle cx="10" cy="-10" r="1.5" fill="#000"/>
<circle cx="-10" cy="20" r="1.5" fill="#000"/>
<circle cx="10" cy="20" r="1.5" fill="#000"/></g>
<text class="lib" x="450" y="228" text-anchor="middle">CONDENSEUR</text>
<text class="sub" x="450" y="246" text-anchor="middle">rejet de chaleur — sous-refroidissement</text>

<!-- DÉTENDEUR (gauche, milieu) -->
<rect class="cadre" x="60" y="290" width="200" height="150"/>
<g transform="translate(160,385) scale(3.0)"><circle cx="0.0" cy="-12.00005" r="5.83095" fill="white" stroke="#000" stroke-width="1"/>
<line x1="0" y1="-18" x2="0" y2="-20" stroke="#000" stroke-width="1"/>
<polygon points="2,1 0,3 -2,1 -10,5 -10,-5 10,5 10,-5 -2,1 0,0 0,0" fill="white" stroke="#000" stroke-width="1"/>
<line x1="0" y1="0" x2="0" y2="-6" stroke="#000" stroke-width="1"/>
<line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
<line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
<circle cx="0" cy="-20" r="1.5" fill="#000"/>
<circle cx="11" cy="0" r="1.5" fill="#000"/>
<circle cx="-11" cy="0" r="1.5" fill="#000"/>
<text x="-5" y="-9.66667" font-family="sans-serif" font-size="6" fill="#333">TC</text></g>
<text class="lib" x="160" y="463" text-anchor="middle">DÉTENDEUR</text>
<text class="sub" x="160" y="481" text-anchor="middle">abaisse la pression</text>

<!-- COMPRESSEUR (droite, milieu) -->
<rect class="cadre" x="640" y="290" width="200" height="150"/>
<g transform="translate(740,365) scale(3.0)"><circle cx="0.0" cy="0.0" r="15.0" fill="white" stroke="#000" stroke-width="1"/>
<line x1="-15" y1="0" x2="-16" y2="0" stroke="#000" stroke-width="1"/>
<line x1="15" y1="0" x2="16" y2="0" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="-13" x2="13" y2="-7" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="13" x2="13" y2="7" stroke="#000" stroke-width="1"/>
<circle cx="-16" cy="0" r="1.5" fill="#000"/>
<circle cx="16" cy="0" r="1.5" fill="#000"/>
<circle cx="-10" cy="10" r="1.5" fill="#000"/>
<circle cx="2" cy="11" r="1.5" fill="#000"/>
<circle cx="-10" cy="-10" r="1.5" fill="#000"/></g>
<text class="lib" x="740" y="463" text-anchor="middle">COMPRESSEUR</text>
<text class="sub" x="740" y="481" text-anchor="middle">cœur du système</text>

<!-- ÉVAPORATEUR (bas, centre) — échangeur à air -->
<rect class="cadre" x="330" y="505" width="240" height="150"/>
<g transform="translate(450,575) scale(3.0)"><line x1="6" y1="-5" x2="6" y2="14" stroke="#000" stroke-width="0.5"/>
<line x1="10" y1="-5.82667" x2="10" y2="-10.16" stroke="#000" stroke-width="1"/>
<line x1="0.5" y1="-5" x2="0.5" y2="14" stroke="#000" stroke-width="0.5"/>
<rect x="-16" y="-5" width="30" height="20" fill="none" stroke="#000" stroke-width="1"/>
<line x1="10" y1="20" x2="10" y2="15" stroke="#000" stroke-width="1"/>
<line x1="-10" y1="20.1359" x2="-10" y2="15.8746" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="-5" x2="-7" y2="14" stroke="#000" stroke-width="0.5"/>
<line x1="-12" y1="-5" x2="10" y2="15" stroke="#000" stroke-width="1"/>
<line x1="10" y1="-5" x2="-12" y2="15" stroke="#000" stroke-width="1"/>
<line x1="-10" y1="-5" x2="-10" y2="-10" stroke="#000" stroke-width="1"/>
<circle cx="-10" cy="-10" r="1.5" fill="#000"/>
<circle cx="10" cy="-10" r="1.5" fill="#000"/>
<circle cx="-10" cy="20" r="1.5" fill="#000"/>
<circle cx="10" cy="20" r="1.5" fill="#000"/></g>
<text class="lib" x="450" y="678" text-anchor="middle">ÉVAPORATEUR</text>
<text class="sub" x="450" y="696" text-anchor="middle">absorbe la chaleur — surchauffe</text>

<!-- Circuit : 1 refoulement (HP gaz chaud) · 2 ligne liquide (HP) · 3 diphasique (BP) · 4 aspiration (BP gaz) -->
<path class="tube-hp" d="M 810 290 L 810 130 L 570 130"/>
<polygon class="fleche" points="582,125 570,130 582,135"/>
<text class="sub" x="690" y="120" text-anchor="middle" fill="#ff6b35" font-weight="bold" font-size="14">1</text>

<path class="tube-hp" d="M 330 130 L 95 130 L 95 290"/>
<polygon class="fleche" points="90,278 95,290 100,278"/>
<text class="sub" x="212" y="120" text-anchor="middle" fill="#ff6b35" font-weight="bold" font-size="14">2</text>

<path class="tube-bp" d="M 95 440 L 95 580 L 330 580"/>
<polygon points="318,575 330,580 318,585" fill="#1b3a63"/>
<text class="sub" x="212" y="570" text-anchor="middle" fill="#1b3a63" font-weight="bold" font-size="14">3</text>

<path class="tube-bp" d="M 570 580 L 810 580 L 810 440"/>
<polygon points="805,452 810,440 815,452" fill="#1b3a63"/>
<text class="sub" x="690" y="570" text-anchor="middle" fill="#1b3a63" font-weight="bold" font-size="14">4</text>

<!-- Axe HP/BP : la frontière passe par le détendeur et le compresseur -->
<line x1="272" y1="372" x2="628" y2="372" stroke="#b8c2cf" stroke-width="1" stroke-dasharray="3,5"/>
<text x="450" y="352" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff6b35">HP</text>
<text x="450" y="404" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1b3a63">BP</text>
<text class="sub" x="450" y="422" text-anchor="middle">moitié haute = HP · moitié basse = BP</text>

<rect x="70" y="716" width="760" height="1" fill="#d8dee6"/>
<g transform="translate(230,736)">
  <line x1="0" y1="0" x2="34" y2="0" class="tube-hp"/>
  <text x="42" y="4" class="sub">Haute pression — gaz chaud (1) puis liquide (2)</text>
  <line x1="330" y1="0" x2="364" y2="0" class="tube-bp"/>
  <text x="372" y="4" class="sub">Basse pression — diphasique (3) puis gaz (4)</text>
</g>
</svg>
