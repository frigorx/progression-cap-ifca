<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="880" height="350" fill="#ffffff"/>
  <text x="20" y="20" font-size="15" font-weight="bold" fill="#1b3a63">Schéma développé — circuit garage protégé (à compléter)</text>

  <!-- ===== fils (couleurs normalisées) ===== -->
  <line x1="30" y1="90" x2="115" y2="90" stroke="#a4321e" stroke-width="2"/>
  <line x1="165" y1="90" x2="255" y2="90" stroke="#a4321e" stroke-width="2"/>
  <line x1="305" y1="90" x2="420" y2="90" stroke="#a4321e" stroke-width="2"/>
  <line x1="465" y1="90" x2="650" y2="90" stroke="#a4321e" stroke-width="2"/>
  <line x1="650" y1="90" x2="650" y2="170" stroke="#a4321e" stroke-width="2"/>
  <line x1="30" y1="230" x2="115" y2="230" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="165" y1="230" x2="255" y2="230" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="305" y1="230" x2="650" y2="230" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="650" y1="210" x2="650" y2="230" stroke="#1f5fa8" stroke-width="2"/>

  <!-- ===== source ===== -->
  <g transform="translate(20,90)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">L</text>
  </g>
  <g transform="translate(20,230)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">N</text>
  </g>

  <!-- ===== appareil 1 — 2 pôles, capteur de fuite (à nommer) ===== -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="115" cy="90" r="1.8" fill="#000"/>
    <line x1="115" y1="90" x2="152" y2="72"/>
    <circle cx="165" cy="90" r="1.8" fill="#000"/>
    <circle cx="115" cy="230" r="1.8" fill="#000"/>
    <line x1="115" y1="230" x2="152" y2="212"/>
    <circle cx="165" cy="230" r="1.8" fill="#000"/>
    <line x1="140" y1="90" x2="140" y2="230" stroke-width="0.6" stroke-dasharray="4,3"/>
    <ellipse cx="145" cy="258" rx="18" ry="6"/>
    <line x1="145" y1="230" x2="145" y2="252" stroke-width="0.6" stroke-dasharray="3,2"/>
  </g>
  <text x="95" y="52" font-size="12" fill="#9aa5b1" font-weight="bold">____</text>
  <text x="70" y="66" font-size="8.5" fill="#9aa5b1">appareil : ______________________</text>
  <text x="103" y="282" font-size="9" fill="#c14a17" font-weight="bold">___ mA</text>
  <text x="60" y="296" font-size="7.5" fill="#5d6b7c">sensibilité — NF C 15-100</text>

  <!-- ===== appareil 2 — 2 pôles, déclencheur thermique (à nommer) ===== -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="255" cy="90" r="1.8" fill="#000"/>
    <line x1="255" y1="90" x2="292" y2="72"/>
    <circle cx="305" cy="90" r="1.8" fill="#000"/>
    <circle cx="255" cy="230" r="1.8" fill="#000"/>
    <line x1="255" y1="230" x2="292" y2="212"/>
    <circle cx="305" cy="230" r="1.8" fill="#000"/>
    <line x1="273" y1="90" x2="273" y2="230" stroke-width="0.6" stroke-dasharray="4,3"/>
    <polyline points="262,52 268,58 262,64 268,70"/>
  </g>
  <text x="235" y="34" font-size="12" fill="#9aa5b1" font-weight="bold">____</text>
  <text x="185" y="47" font-size="8.5" fill="#9aa5b1">appareil : ______________________</text>
  <text x="200" y="288" font-size="7.5" fill="#5d6b7c" font-style="italic">calibre : selon matériel de</text>
  <text x="200" y="298" font-size="7.5" fill="#5d6b7c" font-style="italic">l'atelier, à faire valider</text>

  <!-- ===== appareil 3 — 1 pôle (à nommer) ===== -->
  <g stroke="#000" stroke-width="1" fill="none">
    <circle cx="420" cy="90" r="1.8" fill="#000"/>
    <line x1="420" y1="90" x2="450" y2="74"/>
    <circle cx="465" cy="90" r="1.8" fill="#000"/>
  </g>
  <text x="405" y="52" font-size="12" fill="#9aa5b1" font-weight="bold">____</text>
  <text x="375" y="66" font-size="8.5" fill="#9aa5b1">appareil : ______</text>

  <!-- ===== appareil 4 — récepteur (à nommer) ===== -->
  <g transform="translate(650,190)" stroke="#000" stroke-width="1" fill="none">
    <ellipse cx="0" cy="0" rx="20" ry="20"/>
    <line x1="14" y1="-14" x2="-14" y2="14"/>
    <line x1="-14" y1="-14" x2="14" y2="14"/>
  </g>
  <text x="678" y="185" font-size="12" fill="#9aa5b1" font-weight="bold">____</text>
  <text x="678" y="198" font-size="8.5" fill="#9aa5b1">appareil : ______</text>

  <!-- ===== PE — terre du tableau, non câblée sur ce montage ===== -->
  <g transform="translate(770,90)">
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#2e7d32" stroke-width="1"/>
    <line x1="-5" y1="2" x2="5" y2="2" stroke="#2e7d32" stroke-width="1"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#2e7d32" stroke-width="1"/>
    <line x1="0" y1="-14" x2="0" y2="0" stroke="#2e7d32" stroke-width="1"/>
    <circle cx="0" cy="-15" r="1.5" fill="#2e7d32"/>
  </g>
  <text x="700" y="115" font-size="8" fill="#5d6b7c">PE — bornier de terre du tableau,</text>
  <text x="700" y="126" font-size="8" fill="#5d6b7c">non câblé ici (pas de masse métallique)</text>

  <text x="600" y="290" font-size="8" fill="#5d6b7c" font-style="italic">Les 2 appareils à 2 pôles coupent</text>
  <text x="600" y="301" font-size="8" fill="#5d6b7c" font-style="italic">toujours phase + neutre ensemble.</text>

  <!-- légende couleurs -->
  <g transform="translate(20,335)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase (rouge/noir)</text>
    <line x1="150" y1="-4" x2="170" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="174" y="-1">Neutre (bleu)</text>
    <line x1="270" y1="-4" x2="290" y2="-4" stroke="#2e7d32" stroke-width="2"/><text x="294" y="-1">Terre (vert/jaune)</text>
  </g>
</svg>
