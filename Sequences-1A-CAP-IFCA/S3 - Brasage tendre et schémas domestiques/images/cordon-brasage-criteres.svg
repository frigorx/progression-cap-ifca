<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="740" height="260" fill="#ffffff"/>
  <text x="20" y="20" font-size="14" font-weight="bold" fill="#1b3a63">Contrôle visuel du cordon de brasage — 4 exemples (croquis pédagogique)</text>

  <!-- ===== PANNEAU 1 — CORDON CONFORME ===== -->
  <g transform="translate(20,40)">
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#1b3a63">1. Cordon conforme</text>
    <rect x="10" y="42" width="80" height="24" fill="#eef1f5" stroke="#5d6b7c" stroke-width="2"/>
    <rect x="82" y="30" width="60" height="48" rx="5" fill="#ffffff" stroke="#1b3a63" stroke-width="2"/>
    <rect x="74" y="36" width="16" height="10" rx="4" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <rect x="74" y="60" width="16" height="10" rx="4" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <circle cx="150" cy="14" r="11" fill="#2f9e44"/>
    <path d="M144,14 l4,5 l9,-11" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="98" font-size="8.7" fill="#333">Continu, brillant, régulier</text>
    <text x="0" y="110" font-size="8.7" fill="#333">tout autour du raccord.</text>
  </g>

  <!-- ===== PANNEAU 2 — MANQUE DE MÉTAL ===== -->
  <g transform="translate(200,40)">
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#1b3a63">2. Manque de métal</text>
    <rect x="10" y="42" width="80" height="24" fill="#eef1f5" stroke="#5d6b7c" stroke-width="2"/>
    <rect x="82" y="30" width="60" height="48" rx="5" fill="#ffffff" stroke="#1b3a63" stroke-width="2"/>
    <rect x="74" y="36" width="16" height="10" rx="4" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <rect x="74" y="60" width="7" height="10" rx="3" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <text x="82" y="69" font-size="14" fill="#c14a17" font-weight="bold">?</text>
    <circle cx="150" cy="14" r="11" fill="#c14a17"/>
    <line x1="145" y1="9" x2="155" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="155" y1="9" x2="145" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="0" y="98" font-size="8.7" fill="#333">Zone sans apport, cordon</text>
    <text x="0" y="110" font-size="8.7" fill="#333">interrompu — non conforme.</text>
  </g>

  <!-- ===== PANNEAU 3 — SURCHAUFFE ===== -->
  <g transform="translate(380,40)">
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#1b3a63">3. Surchauffe</text>
    <rect x="10" y="42" width="80" height="24" fill="#eef1f5" stroke="#5d6b7c" stroke-width="2"/>
    <rect x="82" y="30" width="60" height="48" rx="5" fill="#f3e9df" stroke="#1b3a63" stroke-width="2"/>
    <polygon points="74,36 92,34 90,48 74,46" fill="#3a2a1a" stroke="#5d6b7c" stroke-width="1.3"/>
    <polygon points="74,60 91,58 90,71 74,70" fill="#3a2a1a" stroke="#5d6b7c" stroke-width="1.3"/>
    <circle cx="150" cy="14" r="11" fill="#c14a17"/>
    <line x1="145" y1="9" x2="155" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="155" y1="9" x2="145" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="0" y="98" font-size="8.7" fill="#333">Cordon noirci, métal brûlé</text>
    <text x="0" y="110" font-size="8.7" fill="#333">et oxydé — non conforme.</text>
  </g>

  <!-- ===== PANNEAU 4 — COULURE ===== -->
  <g transform="translate(560,40)">
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#1b3a63">4. Coulure</text>
    <rect x="10" y="42" width="80" height="24" fill="#eef1f5" stroke="#5d6b7c" stroke-width="2"/>
    <rect x="82" y="30" width="60" height="48" rx="5" fill="#ffffff" stroke="#1b3a63" stroke-width="2"/>
    <rect x="74" y="36" width="16" height="10" rx="4" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <rect x="74" y="60" width="16" height="10" rx="4" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.3"/>
    <path d="M78,70 q4,14 -2,20 q-4,4 -8,0 q-4,-6 2,-16 z" fill="#b8bfc9" stroke="#5d6b7c" stroke-width="1.2"/>
    <circle cx="150" cy="14" r="11" fill="#c14a17"/>
    <line x1="145" y1="9" x2="155" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="155" y1="9" x2="145" y2="19" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="0" y="98" font-size="8.7" fill="#333">Excès d'apport, goutte figée</text>
    <text x="0" y="110" font-size="8.7" fill="#333">sous le raccord — non conforme.</text>
  </g>

  <!-- légende -->
  <text x="20" y="160" font-size="8.5" fill="#5d6b7c" font-style="italic">Vue en coupe longitudinale d'une emboîture brasée (tube à gauche, collerette à droite). Croquis pédagogique F. Henninot — pas une photo.</text>
  <text x="20" y="174" font-size="8.5" fill="#5d6b7c" font-style="italic">Un cordon conforme est CONTINU, BRILLANT, SANS MANQUE ET SANS SURCHAUFFE — les 4 critères observables du contrôle visuel (S3-F2).</text>
</svg>
