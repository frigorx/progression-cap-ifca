<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="560" height="270" fill="#ffffff"/>
  <text x="16" y="22" font-size="14" font-weight="bold" fill="#1b3a63">Schéma unifilaire — implantation du couloir (télérupteur) — à compléter</text>

  <text x="16" y="66" font-size="9.5" fill="#5d6b7c" font-style="italic">ce qui change depuis S2 :</text>
  <g transform="translate(150,64) scale(1.6)">
    <line x1="2" y1="0" x2="9" y2="-11" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="5.0" rx="5.0" ry="5.0" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#000"/>
    <line x1="-8" y1="-14" x2="10" y2="10" stroke="#c14a17" stroke-width="1.4"/>
  </g>
  <text x="180" y="66" font-size="9.5" fill="#333">avant : interrupteur (retiré)</text>
  <g transform="translate(340,64) scale(1.6)">
    <ellipse cx="0.0" cy="0.0" rx="7.5" ry="7.5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="0.0" rx="4.2" ry="4.2" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-8" r="1.5" fill="#000"/>
  </g>
  <text x="365" y="66" font-size="9.5" fill="#333">après : bouton poussoir</text>

