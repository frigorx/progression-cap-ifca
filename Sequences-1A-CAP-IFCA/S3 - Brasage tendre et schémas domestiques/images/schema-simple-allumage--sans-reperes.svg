<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 275" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="620" height="275" fill="#ffffff"/>
  <text x="20" y="20" font-size="15" font-weight="bold" fill="#1b3a63">Schéma développé — simple allumage</text>

  <!-- ===== fils (couleurs normalisées) ===== -->
  <!-- phase : source -> disjoncteur -> interrupteur -> descente vers lampe -->
  <line x1="30" y1="70" x2="110" y2="70" stroke="#a4321e" stroke-width="2"/>
  <line x1="160" y1="70" x2="249" y2="70" stroke="#a4321e" stroke-width="2"/>
  <line x1="291" y1="70" x2="380" y2="70" stroke="#a4321e" stroke-width="2"/>
  <line x1="380" y1="70" x2="380" y2="145" stroke="#a4321e" stroke-width="2"/>
  <!-- neutre : lampe -> bus bas -> source -->
  <line x1="380" y1="185" x2="380" y2="230" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="380" y1="230" x2="30" y2="230" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="30" y1="230" x2="30" y2="210" stroke="#1f5fa8" stroke-width="2"/>

  <!-- ===== symboles (bibliothèque inerWeb) ===== -->
  <!-- source Phase (svg/sources/source_phase_l.svg) -->
  <g transform="translate(20,70)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">L</text>
  </g>

  <!-- disjoncteur 1P (svg/protections/disjoncteur_1p.svg), rotate -90 pour l'insérer sur une ligne horizontale — repère et nom retirés (schéma à compléter) -->
  <g transform="translate(140,70) rotate(-90)">
    <line x1="0" y1="15.5" x2="0" y2="20" stroke="#000" stroke-width="1"/>
    <path d="M -0.00 15.50 A 4.00 2.50 0 0 0 0.00 10.50" fill="none" stroke="#000" stroke-width="1"/>
    <polyline points="0,10.5 0,8 5,8 5,3 0,3 0,0 -5,-20" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="-20" stroke="#000" stroke-width="1"/>
    <line x1="2" y1="-25" x2="-2" y2="-21" stroke="#000" stroke-width="1"/>
    <line x1="-2" y1="-25" x2="2" y2="-21" stroke="#000" stroke-width="1"/>
    <line x1="-2" y1="-19" x2="2" y2="-19" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-30" r="1.5" fill="#000"/>
    <circle cx="0" cy="20" r="1.5" fill="#000"/>
  </g>

  <!-- interrupteur (svg/contacts/interrupteur.svg), rotate -90 — repère et nom retirés (schéma à compléter) -->
  <g transform="translate(270,70) rotate(-90)">
    <ellipse cx="0.0" cy="10.0" rx="1.8" ry="1.8" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="-12.5" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="-10.0" rx="1.8" ry="1.8" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-5" y1="-10" x2="-0.7" y2="8" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="12" x2="0" y2="17" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="21" r="1.5" fill="#000"/>
    <circle cx="0" cy="-21" r="1.5" fill="#000"/>
  </g>

  <!-- lampe (symbole le plus proche en bibliothèque : voyant lumineux, svg/recepteurs/voyant_lumineux.svg) — repère et nom retirés (schéma à compléter) -->
  <g transform="translate(380,165)">
    <ellipse cx="0.0" cy="0.0" rx="10.0" ry="10.0" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="-10" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-20" r="1.5" fill="#000"/>
    <circle cx="0" cy="20" r="1.5" fill="#000"/>
  </g>

  <!-- source Neutre -->
  <g transform="translate(20,210)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">N</text>
  </g>

  <!-- Terre du tableau, présente mais non câblée sur ce montage (pas de masse métallique) -->
  <g transform="translate(500,120)">
    <line x1="-3" y1="4" x2="3" y2="4" stroke="#2e7d32" stroke-width="1"/>
    <line x1="-5" y1="2" x2="5" y2="2" stroke="#2e7d32" stroke-width="1"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#2e7d32" stroke-width="1"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#2e7d32" stroke-width="1"/>
    <circle cx="0" cy="-11" r="1.5" fill="#2e7d32"/>
  </g>
  <text x="440" y="145" font-size="8" fill="#5d6b7c">PE — bornier de terre du tableau,</text>
  <text x="440" y="156" font-size="8" fill="#5d6b7c">non câblé ici (pas de masse métallique)</text>

  <!-- légende couleurs -->
  <g transform="translate(20,255)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase (rouge/noir)</text>
    <line x1="140" y1="-4" x2="160" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="164" y="-1">Neutre (bleu)</text>
    <line x1="250" y1="-4" x2="270" y2="-4" stroke="#2e7d32" stroke-width="2"/><text x="274" y="-1">Terre (vert/jaune)</text>
  </g>
</svg>
