<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="780" height="300" fill="#ffffff"/>
  <text x="20" y="20" font-size="15" font-weight="bold" fill="#1b3a63">Schéma développé — va-et-vient</text>

  <!-- ===== fils (couleurs normalisées) ===== -->
  <!-- phase : source -> disjoncteur -> commun S1 -->
  <line x1="30" y1="70" x2="110" y2="70" stroke="#a4321e" stroke-width="2"/>
  <line x1="160" y1="70" x2="250" y2="70" stroke="#a4321e" stroke-width="2"/>
  <!-- navette 1 (droite) : contact bas-gauche S1 -> contact bas-droit S2 (parcours direct) -->
  <line x1="240" y1="110" x2="460" y2="110" stroke="#7b5cf5" stroke-width="2"/>
  <!-- navette 2 (décalée) : contact bas-droit S1 -> contact bas-gauche S2 -->
  <line x1="260" y1="110" x2="260" y2="140" stroke="#e0a800" stroke-width="2"/>
  <line x1="260" y1="140" x2="480" y2="140" stroke="#e0a800" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="110" stroke="#e0a800" stroke-width="2"/>
  <!-- commun S2 -> lampe -->
  <line x1="470" y1="70" x2="560" y2="70" stroke="#a4321e" stroke-width="2"/>
  <line x1="560" y1="70" x2="560" y2="145" stroke="#a4321e" stroke-width="2"/>
  <!-- neutre : lampe -> bus bas -> source -->
  <line x1="560" y1="185" x2="560" y2="250" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="560" y1="250" x2="30" y2="250" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="30" y1="250" x2="30" y2="210" stroke="#1f5fa8" stroke-width="2"/>

  <!-- ===== symboles (bibliothèque inerWeb) ===== -->
  <!-- source Phase -->
  <g transform="translate(20,70)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">L</text>
  </g>

  <!-- Q1 — disjoncteur 1P, rotate -90 -->
  <g transform="translate(140,70) rotate(-90)">
    <line x1="0" y1="15.5" x2="0" y2="20" stroke="#000" stroke-width="1"/>
    <path d="M -0.00 15.50 A 4.00 2.50 0 0 0 0.00 10.50" fill="none" stroke="#000" stroke-width="1"/>
    <polyline points="0,10.5 0,8 5,8 5,3 0,3 0,0 -5,-20" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-30" x2="0" y2="-20" stroke="#000" stroke-width="1"/>
    <line x1="2" y1="-25" x2="-2" y2="-21" stroke="#000" stroke-width="1"/>
    <line x1="-2" y1="-25" x2="2" y2="-21" stroke="#000" stroke-width="1"/>
    <line x1="-2" y1="-19" x2="2" y2="-19" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-30" r="1.5" fill="#000"/>
    <circle cx="0" cy="20" r="1.5" fill="#000"/>
  </g>
  <text x="122" y="40" font-size="11" fill="#1b3a63" font-weight="bold">Q1</text>
  <text x="95" y="95" font-size="8.5" fill="#5d6b7c">disjoncteur</text>

  <!-- S1 — va-et-vient (svg/contacts/va_et_vient.svg), commun en haut -->
  <g transform="translate(240,100)">
    <line x1="9" y1="-13" x2="2" y2="1" stroke="#000" stroke-width="1"/>
    <ellipse cx="20.0" cy="0.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="10.0" cy="-15.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="0.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="2" x2="0" y2="10" stroke="#000" stroke-width="1"/>
    <line x1="20" y1="2" x2="20" y2="10" stroke="#000" stroke-width="1"/>
    <line x1="10" y1="-17" x2="10" y2="-30" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="10" r="1.5" fill="#000"/>
    <circle cx="20" cy="10" r="1.5" fill="#000"/>
    <circle cx="10" cy="-30" r="1.5" fill="#000"/>
  </g>
  <text x="222" y="55" font-size="11" fill="#1b3a63" font-weight="bold">S1</text>
  <text x="196" y="185" font-size="9" fill="#5d6b7c">interrupteur va-et-vient n°1</text>

  <!-- S2 — va-et-vient, miroir horizontal (commun ressort vers la droite) -->
  <g transform="translate(480,100) scale(-1,1)">
    <line x1="9" y1="-13" x2="2" y2="1" stroke="#000" stroke-width="1"/>
    <ellipse cx="20.0" cy="0.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="10.0" cy="-15.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="0.0" rx="1.5" ry="1.5" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="2" x2="0" y2="10" stroke="#000" stroke-width="1"/>
    <line x1="20" y1="2" x2="20" y2="10" stroke="#000" stroke-width="1"/>
    <line x1="10" y1="-17" x2="10" y2="-30" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="10" r="1.5" fill="#000"/>
    <circle cx="20" cy="10" r="1.5" fill="#000"/>
    <circle cx="10" cy="-30" r="1.5" fill="#000"/>
  </g>
  <text x="462" y="55" font-size="11" fill="#1b3a63" font-weight="bold">S2</text>
  <text x="436" y="185" font-size="9" fill="#5d6b7c">interrupteur va-et-vient n°2</text>

  <text x="295" y="128" font-size="8.5" fill="#7b5cf5">navette 1</text>
  <text x="330" y="155" font-size="8.5" fill="#e0a800">navette 2</text>

  <!-- H1 — lampe (voyant lumineux) -->
  <g transform="translate(560,165)">
    <ellipse cx="0.0" cy="0.0" rx="10.0" ry="10.0" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="-7" x2="-7" y2="7" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-20" x2="0" y2="-10" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-20" r="1.5" fill="#000"/>
    <circle cx="0" cy="20" r="1.5" fill="#000"/>
  </g>
  <text x="580" y="160" font-size="11" fill="#1b3a63" font-weight="bold">H1</text>
  <text x="580" y="172" font-size="8.5" fill="#5d6b7c">lampe</text>

  <!-- source Neutre -->
  <g transform="translate(20,210)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="10" cy="0" r="1.5" fill="#000"/>
    <text x="-14" y="4" font-family="sans-serif" font-size="7" fill="#333">N</text>
  </g>

  <!-- légende couleurs -->
  <g transform="translate(20,280)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase (rouge/noir)</text>
    <line x1="140" y1="-4" x2="160" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="164" y="-1">Neutre (bleu)</text>
    <line x1="250" y1="-4" x2="270" y2="-4" stroke="#7b5cf5" stroke-width="2"/><text x="274" y="-1">Navette 1</text>
    <line x1="340" y1="-4" x2="360" y2="-4" stroke="#e0a800" stroke-width="2"/><text x="364" y="-1">Navette 2</text>
  </g>
</svg>
