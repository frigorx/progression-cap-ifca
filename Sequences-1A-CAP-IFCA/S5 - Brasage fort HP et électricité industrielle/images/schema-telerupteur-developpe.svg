<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1b3a63">Schéma développé — télérupteur (couloir du pavillon)</text>

  <!-- ===== bus Ph / N / PE ===== -->
  <line x1="50" y1="44" x2="50" y2="88" stroke="#a4321e" stroke-width="2"/>
  <line x1="50" y1="128" x2="50" y2="358" stroke="#a4321e" stroke-width="2"/>
  <line x1="690" y1="44" x2="690" y2="88" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="690" y1="128" x2="690" y2="358" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="725" y1="44" x2="725" y2="358" stroke="#2e7d32" stroke-width="2"/>
  <text x="38" y="38" font-size="10" fill="#333">Ph</text>
  <text x="682" y="38" font-size="10" fill="#333">N</text>
  <text x="718" y="38" font-size="10" fill="#333">PE</text>

  <!-- ===== Q2 — disjoncteur 1P+N (svg/protections/disjoncteur_1p_n.svg — copié dans ce dossier) ===== -->
  <g stroke="#000" stroke-width="1.3" fill="none">
    <line x1="50" y1="88" x2="63" y2="106"/>
    <circle cx="50" cy="88" r="2" fill="#000"/>
    <circle cx="50" cy="128" r="2" fill="#000"/>
    <line x1="690" y1="88" x2="703" y2="106"/>
    <circle cx="690" cy="88" r="2" fill="#000"/>
    <circle cx="690" cy="128" r="2" fill="#000"/>
  </g>
  <line x1="50" y1="107" x2="690" y2="107" stroke="#000" stroke-width="0.6" stroke-dasharray="5,3"/>
  <text x="58" y="82" font-size="11" fill="#1b3a63" font-weight="bold">Q2</text>
  <text x="100" y="120" font-size="8" fill="#5d6b7c">disjoncteur 1P+N — 16 A (NF C 15-100)</text>

  <!-- ===== circuit de commande (boutons poussoirs en parallèle) ===== -->
  <text x="440" y="120" font-size="9" fill="#5d6b7c" font-style="italic">circuit de commande</text>
  <line x1="50" y1="180" x2="130" y2="180" stroke="#a4321e" stroke-width="2"/>
  <line x1="130" y1="155" x2="130" y2="205" stroke="#a4321e" stroke-width="2"/>

  <!-- S1 -->
  <line x1="130" y1="155" x2="225" y2="155" stroke="#a4321e" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.2" fill="none">
    <line x1="167" y1="155" x2="181" y2="142"/>
    <line x1="174" y1="150" x2="174" y2="162"/>
    <circle cx="167" cy="155" r="1.6" fill="#000"/>
    <circle cx="188" cy="155" r="1.6" fill="#000"/>
  </g>
  <text x="164" y="138" font-size="10" font-weight="bold" fill="#1b3a63">S1</text>

  <!-- S2 -->
  <line x1="130" y1="180" x2="225" y2="180" stroke="#a4321e" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.2" fill="none">
    <line x1="167" y1="180" x2="181" y2="167"/>
    <line x1="174" y1="175" x2="174" y2="187"/>
    <circle cx="167" cy="180" r="1.6" fill="#000"/>
    <circle cx="188" cy="180" r="1.6" fill="#000"/>
  </g>
  <text x="196" y="177" font-size="10" font-weight="bold" fill="#1b3a63">S2</text>

  <!-- S3 -->
  <line x1="130" y1="205" x2="225" y2="205" stroke="#a4321e" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.2" fill="none">
    <line x1="167" y1="205" x2="181" y2="192"/>
    <line x1="174" y1="200" x2="174" y2="212"/>
    <circle cx="167" cy="205" r="1.6" fill="#000"/>
    <circle cx="188" cy="205" r="1.6" fill="#000"/>
  </g>
  <text x="164" y="223" font-size="10" font-weight="bold" fill="#1b3a63">S3</text>

  <line x1="225" y1="155" x2="225" y2="205" stroke="#a4321e" stroke-width="2"/>
  <line x1="225" y1="180" x2="320" y2="180" stroke="#a4321e" stroke-width="2"/>

  <!-- bobine T1 (svg/bobines/telerupteur.svg — copié dans ce dossier, terminaux A1/A2) -->
  <rect x="320" y="160" width="60" height="40" fill="#f5f8fc" stroke="#000" stroke-width="1.3"/>
  <line x1="350" y1="160" x2="350" y2="140" stroke="#000" stroke-width="1"/>
  <line x1="350" y1="200" x2="350" y2="220" stroke="#000" stroke-width="1"/>
  <text x="333" y="184" font-size="12" fill="#333">T1</text>
  <text x="284" y="152" font-size="8" fill="#5d6b7c">A1</text>
  <text x="384" y="152" font-size="8" fill="#5d6b7c">A2</text>
  <line x1="380" y1="180" x2="690" y2="180" stroke="#a4321e" stroke-width="2"/>
  <text x="392" y="145" font-size="11" font-weight="bold" fill="#1b3a63">T1 — télérupteur (bobine)</text>

  <!-- liaison commande -> contact de sortie (pointillé = commandé par T1) -->
  <line x1="350" y1="220" x2="350" y2="270" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="350" y1="270" x2="185" y2="270" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="185" y1="270" x2="185" y2="288" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>

  <!-- ===== circuit de puissance (contact de sortie T1 -> lampes) ===== -->
  <text x="95" y="270" font-size="9" fill="#5d6b7c" font-style="italic">circuit de puissance</text>
  <line x1="50" y1="300" x2="150" y2="300" stroke="#a4321e" stroke-width="2"/>
  <g stroke="#000" stroke-width="1.2" fill="none">
    <line x1="160" y1="300" x2="176" y2="286"/>
    <circle cx="160" cy="300" r="1.6" fill="#000"/>
    <circle cx="185" cy="300" r="1.6" fill="#000"/>
  </g>
  <text x="150" y="285" font-size="8" fill="#5d6b7c">A1</text>
  <text x="190" y="285" font-size="8" fill="#5d6b7c">4</text>
  <text x="130" y="320" font-size="9" fill="#5d6b7c">contact de T1, commandé par la bobine (ci-dessus, en pointillé)</text>
  <line x1="185" y1="300" x2="480" y2="300" stroke="#a4321e" stroke-width="2"/>
  <line x1="480" y1="260" x2="480" y2="340" stroke="#a4321e" stroke-width="2"/>

  <!-- L1, L2, L3 -->
  <g>
    <line x1="480" y1="260" x2="545" y2="260" stroke="#a4321e" stroke-width="2"/>
    <circle cx="565" cy="260" r="11" fill="none" stroke="#000" stroke-width="1.2"/>
    <line x1="557" y1="252" x2="573" y2="268" stroke="#000" stroke-width="1"/>
    <line x1="557" y1="268" x2="573" y2="252" stroke="#000" stroke-width="1"/>
    <line x1="576" y1="260" x2="690" y2="260" stroke="#1f5fa8" stroke-width="2"/>
    <text x="580" y="248" font-size="10" font-weight="bold" fill="#1b3a63">L1</text>
  </g>
  <g>
    <line x1="480" y1="300" x2="545" y2="300" stroke="#a4321e" stroke-width="2"/>
    <circle cx="565" cy="300" r="11" fill="none" stroke="#000" stroke-width="1.2"/>
    <line x1="557" y1="292" x2="573" y2="308" stroke="#000" stroke-width="1"/>
    <line x1="557" y1="308" x2="573" y2="292" stroke="#000" stroke-width="1"/>
    <line x1="576" y1="300" x2="690" y2="300" stroke="#1f5fa8" stroke-width="2"/>
    <text x="580" y="288" font-size="10" font-weight="bold" fill="#1b3a63">L2</text>
  </g>
  <g>
    <line x1="480" y1="340" x2="545" y2="340" stroke="#a4321e" stroke-width="2"/>
    <circle cx="565" cy="340" r="11" fill="none" stroke="#000" stroke-width="1.2"/>
    <line x1="557" y1="332" x2="573" y2="348" stroke="#000" stroke-width="1"/>
    <line x1="557" y1="348" x2="573" y2="332" stroke="#000" stroke-width="1"/>
    <line x1="576" y1="340" x2="690" y2="340" stroke="#1f5fa8" stroke-width="2"/>
    <text x="580" y="360" font-size="10" font-weight="bold" fill="#1b3a63">L3</text>
  </g>

  <text x="440" y="392" font-size="8" fill="#5d6b7c">PE — bornier de terre du tableau, non câblé sur ce montage (pas de masse métallique)</text>

  <!-- légende couleurs -->
  <g transform="translate(20,378)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase (rouge/noir)</text>
    <line x1="140" y1="-4" x2="160" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="164" y="-1">Neutre (bleu)</text>
    <line x1="250" y1="-4" x2="270" y2="-4" stroke="#2e7d32" stroke-width="2"/><text x="274" y="-1">Terre (vert/jaune)</text>
  </g>
</svg>
