<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1b3a63">Schéma du coffret clim — à compléter (repères à retrouver et inscrire)</text>

  <line x1="440" y1="40" x2="440" y2="560" stroke="#d8dee6" stroke-width="1.4" stroke-dasharray="7,4"/>
  <text x="20" y="50" font-size="11" font-weight="bold" fill="#5d6b7c">PARTIE PUISSANCE</text>
  <text x="460" y="50" font-size="11" font-weight="bold" fill="#5d6b7c">PARTIE COMMANDE</text>

  <!-- ============================================================= -->
  <!-- PARTIE PUISSANCE (repères retirés) -->
  <!-- ============================================================= -->
  <line x1="140" y1="84" x2="140" y2="470" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="84" x2="200" y2="470" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="84" x2="260" y2="470" stroke="#000" stroke-width="1.6"/>

  <!-- Q1 -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <line x1="140" y1="130" x2="150" y2="155"/>
    <line x1="200" y1="130" x2="210" y2="155"/>
    <line x1="260" y1="130" x2="270" y2="155"/>
  </g>
  <circle cx="140" cy="130" r="2" fill="#000"/><circle cx="140" cy="165" r="2" fill="#000"/>
  <circle cx="200" cy="130" r="2" fill="#000"/><circle cx="200" cy="165" r="2" fill="#000"/>
  <circle cx="260" cy="130" r="2" fill="#000"/><circle cx="260" cy="165" r="2" fill="#000"/>
  <line x1="140" y1="123" x2="260" y2="123" stroke="#000" stroke-width="0.6" stroke-dasharray="5,3"/>
  <line x1="90" y1="123" x2="140" y2="123" stroke="#000" stroke-width="0.6" stroke-dasharray="5,3"/>

  <!-- KM1 puissance -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <line x1="140" y1="220" x2="150" y2="245"/>
    <line x1="200" y1="220" x2="210" y2="245"/>
    <line x1="260" y1="220" x2="270" y2="245"/>
  </g>
  <circle cx="140" cy="220" r="2" fill="#000"/><circle cx="140" cy="255" r="2" fill="#000"/>
  <circle cx="200" cy="220" r="2" fill="#000"/><circle cx="200" cy="255" r="2" fill="#000"/>
  <circle cx="260" cy="220" r="2" fill="#000"/><circle cx="260" cy="255" r="2" fill="#000"/>
  <line x1="140" y1="213" x2="260" y2="213" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>

  <!-- F1 relais thermique -->
  <rect x="122" y="290" width="156" height="50" fill="none" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <g stroke="#000" stroke-width="1.4">
    <line x1="140" y1="300" x2="140" y2="330"/>
    <line x1="200" y1="300" x2="200" y2="330"/>
    <line x1="260" y1="300" x2="260" y2="330"/>
    <line x1="133" y1="307" x2="147" y2="307"/><line x1="133" y1="323" x2="147" y2="323"/>
    <line x1="193" y1="307" x2="207" y2="307"/><line x1="193" y1="323" x2="207" y2="323"/>
    <line x1="253" y1="307" x2="267" y2="307"/><line x1="253" y1="323" x2="267" y2="323"/>
  </g>

  <!-- M1 moteur -->
  <line x1="140" y1="470" x2="140" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="470" x2="200" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="470" x2="260" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="140" y1="480" x2="170" y2="497" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="480" x2="200" y2="497" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="480" x2="230" y2="497" stroke="#000" stroke-width="1.6"/>
  <circle cx="200" cy="527" r="30" fill="#f5f8fc" stroke="#000" stroke-width="1.6"/>

  <!-- ============================================================= -->
  <!-- PARTIE COMMANDE (repères retirés) -->
  <!-- ============================================================= -->
  <line x1="540" y1="80" x2="1180" y2="80" stroke="#a4321e" stroke-width="2.5"/>
  <line x1="540" y1="520" x2="1180" y2="520" stroke="#1f5fa8" stroke-width="2.5"/>

  <!-- Rung A -->
  <line x1="640" y1="80" x2="640" y2="115" stroke="#a4321e" stroke-width="2"/>
  <circle cx="640" cy="115" r="2.2" fill="#000"/>
  <circle cx="640" cy="175" r="2.2" fill="#000"/>
  <line x1="640" y1="115" x2="640" y2="125" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="125" x2="650" y2="145" stroke="#000" stroke-width="1.2"/>
  <line x1="643" y1="145" x2="657" y2="145" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="165" x2="640" y2="175" stroke="#000" stroke-width="1.2"/>

  <line x1="640" y1="175" x2="640" y2="195" stroke="#a4321e" stroke-width="2"/>
  <circle cx="640" cy="195" r="2.2" fill="#000"/>
  <circle cx="640" cy="255" r="2.2" fill="#000"/>
  <line x1="640" y1="195" x2="640" y2="205" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="205" x2="650" y2="225" stroke="#000" stroke-width="1.2"/>
  <line x1="643" y1="225" x2="657" y2="225" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="245" x2="640" y2="255" stroke="#000" stroke-width="1.2"/>

  <line x1="640" y1="255" x2="590" y2="255" stroke="#a4321e" stroke-width="2"/>
  <line x1="640" y1="255" x2="690" y2="255" stroke="#a4321e" stroke-width="2"/>

  <!-- S1 -->
  <line x1="590" y1="255" x2="590" y2="265" stroke="#a4321e" stroke-width="2"/>
  <circle cx="590" cy="265" r="2.2" fill="#000"/>
  <circle cx="590" cy="325" r="2.2" fill="#000"/>
  <line x1="590" y1="265" x2="590" y2="275" stroke="#000" stroke-width="1.2"/>
  <line x1="590" y1="275" x2="600" y2="295" stroke="#000" stroke-width="1.2"/>
  <line x1="590" y1="315" x2="590" y2="325" stroke="#000" stroke-width="1.2"/>

  <!-- KM1 13-14 -->
  <line x1="690" y1="255" x2="690" y2="265" stroke="#a4321e" stroke-width="2"/>
  <circle cx="690" cy="265" r="2.2" fill="#000"/>
  <circle cx="690" cy="315" r="2.2" fill="#000"/>
  <line x1="690" y1="265" x2="690" y2="275" stroke="#000" stroke-width="1.2"/>
  <line x1="690" y1="275" x2="700" y2="295" stroke="#000" stroke-width="1.2"/>
  <line x1="690" y1="305" x2="690" y2="315" stroke="#000" stroke-width="1.2"/>
  <line x1="690" y1="315" x2="690" y2="325" stroke="#a4321e" stroke-width="2"/>

  <line x1="590" y1="325" x2="640" y2="325" stroke="#a4321e" stroke-width="2"/>
  <line x1="690" y1="325" x2="640" y2="325" stroke="#a4321e" stroke-width="2"/>

  <!-- contact à intercaler (TH1) -->
  <line x1="640" y1="325" x2="640" y2="345" stroke="#a4321e" stroke-width="2"/>
  <circle cx="640" cy="345" r="2.2" fill="#000"/>
  <circle cx="640" cy="405" r="2.2" fill="#000"/>
  <line x1="640" y1="345" x2="640" y2="355" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="355" x2="650" y2="375" stroke="#000" stroke-width="1.2"/>
  <line x1="643" y1="375" x2="657" y2="375" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="395" x2="640" y2="405" stroke="#000" stroke-width="1.2"/>

  <line x1="640" y1="405" x2="640" y2="420" stroke="#a4321e" stroke-width="2"/>

  <!-- bobine -->
  <circle cx="640" cy="420" r="2.2" fill="#000"/>
  <circle cx="640" cy="460" r="2.2" fill="#000"/>
  <line x1="640" y1="420" x2="640" y2="428" stroke="#000" stroke-width="1.2"/>
  <rect x="626" y="428" width="28" height="24" fill="#f5f8fc" stroke="#000" stroke-width="1.3"/>
  <line x1="640" y1="452" x2="640" y2="460" stroke="#000" stroke-width="1.2"/>
  <line x1="640" y1="460" x2="640" y2="520" stroke="#a4321e" stroke-width="2"/>

  <!-- liaison mécanique bobine <-> 13-14 -->
  <line x1="654" y1="440" x2="712" y2="440" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="712" y1="440" x2="712" y2="295" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <line x1="712" y1="295" x2="700" y2="295" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>

  <!-- voyant H1 (générique, sans couleur de fonction) -->
  <line x1="640" y1="405" x2="820" y2="405" stroke="#a4321e" stroke-width="2"/>
  <line x1="820" y1="405" x2="820" y2="429" stroke="#a4321e" stroke-width="2"/>
  <circle cx="820" cy="445" r="16" fill="#eef1f5" stroke="#000" stroke-width="1.3"/>
  <line x1="812" y1="437" x2="828" y2="453" stroke="#000" stroke-width="1.1"/>
  <line x1="812" y1="453" x2="828" y2="437" stroke="#000" stroke-width="1.1"/>
  <line x1="820" y1="461" x2="820" y2="520" stroke="#a4321e" stroke-width="2"/>

  <!-- Rung C -->
  <line x1="1020" y1="80" x2="1020" y2="115" stroke="#a4321e" stroke-width="2"/>
  <circle cx="1020" cy="115" r="2.2" fill="#000"/>
  <circle cx="1020" cy="175" r="2.2" fill="#000"/>
  <line x1="1020" y1="115" x2="1020" y2="125" stroke="#000" stroke-width="1.2"/>
  <line x1="1020" y1="125" x2="1030" y2="145" stroke="#000" stroke-width="1.2"/>
  <line x1="1020" y1="165" x2="1020" y2="175" stroke="#000" stroke-width="1.2"/>

  <line x1="1020" y1="175" x2="1020" y2="209" stroke="#a4321e" stroke-width="2"/>
  <circle cx="1020" cy="225" r="16" fill="#eef1f5" stroke="#000" stroke-width="1.3"/>
  <line x1="1012" y1="217" x2="1028" y2="233" stroke="#000" stroke-width="1.1"/>
  <line x1="1012" y1="233" x2="1028" y2="217" stroke="#000" stroke-width="1.1"/>
  <line x1="1020" y1="241" x2="1020" y2="520" stroke="#a4321e" stroke-width="2"/>

  <!-- liaison mécanique F1 -->
  <line x1="656" y1="145" x2="1016" y2="145" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>

  <!-- légende (conservée : convention, pas un repère à retrouver) -->
  <g transform="translate(20,600)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#a4321e" stroke-width="2"/><text x="24" y="-1">Phase</text>
    <line x1="230" y1="-4" x2="250" y2="-4" stroke="#1f5fa8" stroke-width="2"/><text x="254" y="-1">Neutre</text>
    <line x1="600" y1="-4" x2="620" y2="-4" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/><text x="624" y="-1">liaison mécanique (même appareil)</text>
  </g>
  <text x="20" y="628" font-size="8.5" fill="#5d6b7c" font-style="italic">À compléter : inscrivez chaque repère (Q1, KM1, F1, M1, S1, S2, TH1, H1, H2) et les bornes utilisées, après lecture du plan légendé.</text>
</svg>
