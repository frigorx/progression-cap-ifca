<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="Calibri, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="420" height="560" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#1b3a63">Schéma de puissance — départ moteur triphasé</text>

  <!-- ===== L1 L2 L3 ===== -->
  <text x="132" y="34" font-size="10" font-weight="bold" fill="#1b3a63">L1</text>
  <text x="192" y="34" font-size="10" font-weight="bold" fill="#1b3a63">L2</text>
  <text x="252" y="34" font-size="10" font-weight="bold" fill="#1b3a63">L3</text>
  <line x1="140" y1="42" x2="140" y2="470" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="42" x2="200" y2="470" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="42" x2="260" y2="470" stroke="#000" stroke-width="1.6"/>

  <!-- ===== Q1 — sectionneur général ===== -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <line x1="140" y1="95" x2="150" y2="120"/>
    <line x1="200" y1="95" x2="210" y2="120"/>
    <line x1="260" y1="95" x2="270" y2="120"/>
  </g>
  <circle cx="140" cy="95" r="2" fill="#000"/><circle cx="140" cy="130" r="2" fill="#000"/>
  <circle cx="200" cy="95" r="2" fill="#000"/><circle cx="200" cy="130" r="2" fill="#000"/>
  <circle cx="260" cy="95" r="2" fill="#000"/><circle cx="260" cy="130" r="2" fill="#000"/>
  <line x1="140" y1="88" x2="260" y2="88" stroke="#000" stroke-width="0.6" stroke-dasharray="5,3"/>
  <line x1="90" y1="88" x2="140" y2="88" stroke="#000" stroke-width="0.6" stroke-dasharray="5,3"/>
  <text x="70" y="80" font-size="8" fill="#5d6b7c" font-style="italic">manœuvre manuelle</text>
  <text x="284" y="115" font-size="10" font-weight="bold" fill="#1b3a63">Q1</text>
  <text x="284" y="129" font-size="8" fill="#5d6b7c">sectionneur général (consignation)</text>

  <!-- ===== KM1 — contacts de puissance ===== -->
  <g stroke="#000" stroke-width="1.4" fill="none">
    <line x1="140" y1="185" x2="150" y2="210"/>
    <line x1="200" y1="185" x2="210" y2="210"/>
    <line x1="260" y1="185" x2="270" y2="210"/>
  </g>
  <circle cx="140" cy="185" r="2" fill="#000"/><circle cx="140" cy="220" r="2" fill="#000"/>
  <circle cx="200" cy="185" r="2" fill="#000"/><circle cx="200" cy="220" r="2" fill="#000"/>
  <circle cx="260" cy="185" r="2" fill="#000"/><circle cx="260" cy="220" r="2" fill="#000"/>
  <line x1="140" y1="178" x2="260" y2="178" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <text x="284" y="205" font-size="10" font-weight="bold" fill="#1b3a63">KM1</text>
  <text x="284" y="219" font-size="8" fill="#5d6b7c">contacts de puissance (3 pôles, NO)</text>

  <!-- ===== F1 — relais thermique ===== -->
  <rect x="122" y="255" width="156" height="50" fill="none" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/>
  <g stroke="#000" stroke-width="1.4">
    <line x1="140" y1="265" x2="140" y2="295"/>
    <line x1="200" y1="265" x2="200" y2="295"/>
    <line x1="260" y1="265" x2="260" y2="295"/>
    <line x1="133" y1="272" x2="147" y2="272"/><line x1="133" y1="288" x2="147" y2="288"/>
    <line x1="193" y1="272" x2="207" y2="272"/><line x1="193" y1="288" x2="207" y2="288"/>
    <line x1="253" y1="272" x2="267" y2="272"/><line x1="253" y1="288" x2="267" y2="288"/>
  </g>
  <text x="284" y="278" font-size="10" font-weight="bold" fill="#1b3a63">F1</text>
  <text x="284" y="292" font-size="8" fill="#5d6b7c">relais thermique (protection surcharge)</text>

  <!-- ===== M1 — moteur triphasé ===== -->
  <line x1="140" y1="470" x2="140" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="470" x2="200" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="470" x2="260" y2="480" stroke="#000" stroke-width="1.6"/>
  <line x1="140" y1="480" x2="170" y2="497" stroke="#000" stroke-width="1.6"/>
  <line x1="200" y1="480" x2="200" y2="497" stroke="#000" stroke-width="1.6"/>
  <line x1="260" y1="480" x2="230" y2="497" stroke="#000" stroke-width="1.6"/>
  <text x="150" y="494" font-size="8" fill="#5d6b7c">U1</text>
  <text x="204" y="494" font-size="8" fill="#5d6b7c">V1</text>
  <text x="234" y="494" font-size="8" fill="#5d6b7c">W1</text>
  <circle cx="200" cy="527" r="30" fill="#f5f8fc" stroke="#000" stroke-width="1.6"/>
  <text x="192" y="535" font-size="18" fill="#333">M</text>
  <text x="240" y="522" font-size="10" font-weight="bold" fill="#1b3a63">M1</text>
  <text x="240" y="536" font-size="8" fill="#5d6b7c">moteur triphasé</text>
  <text x="20" y="552" font-size="8" fill="#5d6b7c" font-style="italic">Un seul moteur (niveau 1A) — RIEN de plus sur ce départ.</text>

  <!-- légende -->
  <g transform="translate(20,510)" font-size="9" fill="#333">
    <line x1="0" y1="-4" x2="20" y2="-4" stroke="#000" stroke-width="1.6"/><text x="24" y="-1">conducteur de puissance</text>
    <line x1="160" y1="-4" x2="180" y2="-4" stroke="#000" stroke-width="0.6" stroke-dasharray="4,2"/><text x="184" y="-1">liaison mécanique (même appareil)</text>
  </g>
</svg>
