<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Calibri, sans-serif">

  <!-- fond -->
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Titre -->
  <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b3a63">Surchauffe et sous-refroidissement</text>
  <text x="450" y="44" text-anchor="middle" font-size="12" fill="#5d6b7c">Où mesurer chaque grandeur sur le circuit frigorifique</text>

  <!-- ===================== CONDUITES ===================== -->
  <!-- Refoulement HP : compresseur -> condenseur -->
  <path d="M 155 270 L 155 130 L 415 130" fill="none" stroke="#c14a17" stroke-width="3"/>
  <polygon points="380,130 368,124 368,136" fill="#c14a17"/>

  <!-- Ligne liquide HP : condenseur -> filtre -> voyant -> détendeur -->
  <path d="M 470 165 L 470 220 L 640 220" fill="none" stroke="#c14a17" stroke-width="3"/>
  <path d="M 660 220 L 692 220" fill="none" stroke="#c14a17" stroke-width="3"/>
  <path d="M 748 220 L 800 220 L 800 345" fill="none" stroke="#c14a17" stroke-width="3"/>
  <path d="M 800 345 L 730 345" fill="none" stroke="#c14a17" stroke-width="3"/>
  <polygon points="560,220 548,214 548,226" fill="#c14a17"/>
  <polygon points="755,345 743,339 743,351" fill="#c14a17"/>

  <!-- Détendeur -> évaporateur -->
  <path d="M 670 345 L 470 345 L 470 380" fill="none" stroke="#c14a17" stroke-width="3"/>
  <polygon points="470,365 464,353 476,353" fill="#c14a17"/>

  <!-- Évaporateur -> aspiration BP -> compresseur -->
  <path d="M 425 400 L 300 400 L 300 235 L 155 235 L 155 210" fill="none" stroke="#1b3a63" stroke-width="3"/>
  <polygon points="300,270 294,282 306,282" fill="#1b3a63"/>
  <polygon points="155,222 149,234 161,234" fill="#1b3a63"/>

  <!-- ===================== COMPRESSEUR (compresseur_general) ===================== -->
  <g transform="translate(155,240) rotate(90) scale(2.6)">
    <circle cx="0.0" cy="0.0" r="15.0" fill="white" stroke="#000" stroke-width="1"/>
    <line x1="-15" y1="0" x2="-16" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="15" y1="0" x2="16" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="-13" x2="13" y2="-7" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="13" x2="13" y2="7" stroke="#000" stroke-width="1"/>
    <circle cx="-16" cy="0" r="1.5" fill="#000"/>
    <circle cx="16" cy="0" r="1.5" fill="#000"/>
    <circle cx="-10" cy="10" r="1.5" fill="#000"/>
    <circle cx="2" cy="11" r="1.5" fill="#000"/>
    <circle cx="-10" cy="-10" r="1.5" fill="#000"/>
  </g>
  <text x="155" y="300" text-anchor="middle" font-size="13" fill="#1b3a63" font-weight="bold">Compresseur</text>

  <!-- ===================== CONDENSEUR (echangeur_a_air) ===================== -->
  <g transform="translate(450,90) scale(1.6)">
    <rect x="-18" y="-20" width="36" height="48" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-14" y1="16" x2="-14" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="16" x2="7" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="14" y1="16" x2="14" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="16" x2="-7" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="16" x2="0" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="-19" y1="20" x2="19" y2="20" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="-2.0" r="15.0" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="-15" x2="13" y2="5" stroke="#000" stroke-width="1"/>
    <path d="M -1.00 -2.00 A 1.00 1.00 0 0 1 0.00 -1.00" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="-15" x2="-13" y2="5" stroke="#000" stroke-width="1"/>
    <path d="M 6.00 5.00 A 6.00 6.00 0 0 1 0.00 -1.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M -7.00 4.00 A 6.00 6.00 0 0 1 -1.00 -2.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 0.00 -1.00 A 6.00 6.00 0 0 1 -6.00 5.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M -6.00 5.00 A 1.00 1.00 0 0 1 -7.00 4.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 1.00 -2.00 A 6.00 6.00 0 0 1 7.00 4.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 0.00 -1.00 A 1.00 1.00 0 0 1 1.00 -2.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 7.00 4.00 A 1.00 1.00 0 0 1 6.00 5.00" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="-7.0" rx="2.5" ry="4.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="-19" cy="20" r="1.5" fill="#000"/>
    <circle cx="19" cy="20" r="1.5" fill="#000"/>
  </g>
  <text x="450" y="205" text-anchor="middle" font-size="13" fill="#1b3a63" font-weight="bold">Condenseur</text>

  <!-- ===================== FILTRE DÉSHYDRATEUR ===================== -->
  <g transform="translate(620,220) scale(1.9)">
    <line x1="-5" y1="-4.22727" x2="-5" y2="1.22727" stroke="#000" stroke-width="1"/>
    <line x1="6" y1="0.494709" x2="9.75" y2="0.494709" stroke="#000" stroke-width="1"/>
    <line x1="2" y1="-0.454545" x2="2" y2="4.45455" stroke="#000" stroke-width="1"/>
    <rect x="-15.75" y="-5.01058" width="21.75" height="10.0106" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-19.5" y1="0.494709" x2="-15.75" y2="0.494709" stroke="#000" stroke-width="1"/>
    <line x1="-12" y1="-0.414828" x2="-12" y2="4.41483" stroke="#000" stroke-width="1"/>
    <circle cx="9.75" cy="0.494709" r="1.5" fill="#000"/>
    <circle cx="-19.5" cy="0.494709" r="1.5" fill="#000"/>
  </g>
  <text x="620" y="255" text-anchor="middle" font-size="11" fill="#5d6b7c">Filtre déshydrateur</text>

  <!-- ===================== VOYANT LIQUIDE ===================== -->
  <g transform="translate(700,220) scale(1.4)">
    <line x1="21.7269" y1="-0.0538826" x2="27.65" y2="-0.0538826" stroke="#000" stroke-width="1"/>
    <rect x="-0.7" y="-5.79239" width="22.75" height="11.7924" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="10.7" cy="0.1" rx="6.1" ry="5.9" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-7.7" y1="-0.0538826" x2="-0.7" y2="-0.0538826" stroke="#000" stroke-width="1"/>
    <circle cx="27.3" cy="-0.0538826" r="1.5" fill="#000"/>
    <circle cx="-7.7" cy="-0.0538826" r="1.5" fill="#000"/>
    <text x="8" y="3" font-family="sans-serif" font-size="6" fill="#333">V</text>
  </g>
  <text x="712" y="255" text-anchor="middle" font-size="11" fill="#5d6b7c">Voyant liquide</text>

  <!-- ===================== POINT SOUS-REFROIDISSEMENT (sortie condenseur, ligne liquide HP) ===================== -->
  <!-- pastille de mesure posée sur la ligne liquide, juste en sortie de condenseur (avant le filtre) -->
  <circle cx="540" cy="220" r="5" fill="#ffffff" stroke="#c14a17" stroke-width="2"/>
  <!-- leader court vers l'étiquette, placée au-dessus de la ligne liquide, entre condenseur et filtre -->
  <path d="M 540 214 L 540 190" fill="none" stroke="#c14a17" stroke-width="1.2"/>
  <rect x="507" y="152" width="66" height="34" rx="6" fill="#f8ece4" stroke="#c14a17" stroke-width="1.2"/>
  <text x="540" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#c14a17">sous-</text>
  <text x="540" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#c14a17">refroid.</text>

  <!-- ===================== PRISE HP (vanne_isolement) ===================== -->
  <g transform="translate(800,260) rotate(90) scale(1.4)">
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <polygon points="-10,-5 10,5 10,-5 -10,5 -10,-4" fill="white" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="0.0" r="2.0" fill="black" stroke="#000" stroke-width="1"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
  </g>

  <!-- ===================== DÉTENDEUR THERMO EXT ===================== -->
  <g transform="translate(700,345) rotate(180) scale(1.9)">
    <circle cx="0.0" cy="-12.00005" r="5.83095" fill="white" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="-18" x2="0" y2="-20" stroke="#000" stroke-width="1"/>
    <polygon points="2,1 0,3 -2,1 -10,5 -10,-5 10,5 10,-5 -2,1 0,0 0,0" fill="white" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="-6" stroke="#000" stroke-width="1"/>
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <circle cx="0" cy="-20" r="1.5" fill="#000"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
    <text x="-5" y="-9.66667" font-family="sans-serif" font-size="6" fill="#333" transform="rotate(180 -5 -9.66667)">TC</text>
  </g>
  <text x="700" y="400" text-anchor="middle" font-size="11" fill="#5d6b7c">Détendeur thermostatique</text>
  <!-- bulbe posé sur la conduite d'aspiration -->
  <path d="M 700 325 L 660 325 L 660 305" fill="none" stroke="#5d6b7c" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- ===================== ÉVAPORATEUR (echangeur_a_air) ===================== -->
  <g transform="translate(450,400) scale(1.6)">
    <rect x="-18" y="-20" width="36" height="48" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-14" y1="16" x2="-14" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="16" x2="7" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="14" y1="16" x2="14" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="16" x2="-7" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="16" x2="0" y2="24" stroke="#000" stroke-width="1"/>
    <line x1="-19" y1="20" x2="19" y2="20" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="-2.0" r="15.0" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="7" y1="-15" x2="13" y2="5" stroke="#000" stroke-width="1"/>
    <path d="M -1.00 -2.00 A 1.00 1.00 0 0 1 0.00 -1.00" fill="none" stroke="#000" stroke-width="1"/>
    <line x1="-7" y1="-15" x2="-13" y2="5" stroke="#000" stroke-width="1"/>
    <path d="M 6.00 5.00 A 6.00 6.00 0 0 1 0.00 -1.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M -7.00 4.00 A 6.00 6.00 0 0 1 -1.00 -2.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 0.00 -1.00 A 6.00 6.00 0 0 1 -6.00 5.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M -6.00 5.00 A 1.00 1.00 0 0 1 -7.00 4.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 1.00 -2.00 A 6.00 6.00 0 0 1 7.00 4.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 0.00 -1.00 A 1.00 1.00 0 0 1 1.00 -2.00" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M 7.00 4.00 A 1.00 1.00 0 0 1 6.00 5.00" fill="none" stroke="#000" stroke-width="1"/>
    <ellipse cx="0.0" cy="-7.0" rx="2.5" ry="4.5" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="-19" cy="20" r="1.5" fill="#000"/>
    <circle cx="19" cy="20" r="1.5" fill="#000"/>
  </g>
  <text x="450" y="470" text-anchor="middle" font-size="13" fill="#1b3a63" font-weight="bold">Évaporateur</text>

  <!-- ===================== POINT SURCHAUFFE (sortie évaporateur, aspiration BP) ===================== -->
  <!-- pastille de mesure posée sur la ligne d'aspiration BP, juste en sortie d'évaporateur -->
  <circle cx="300" cy="370" r="5" fill="#ffffff" stroke="#1b3a63" stroke-width="2"/>
  <!-- leader court vers l'étiquette, placée à gauche dans la zone libre entre les deux tuyaux -->
  <path d="M 294 368 L 262 356" fill="none" stroke="#1b3a63" stroke-width="1.2"/>
  <rect x="196" y="336" width="66" height="34" rx="6" fill="#eef2f7" stroke="#1b3a63" stroke-width="1.2"/>
  <text x="229" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b3a63">sur-</text>
  <text x="229" y="364" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b3a63">chauffe</text>

  <!-- ===================== PRISE BP (vanne_isolement) ===================== -->
  <g transform="translate(155,235) rotate(90) scale(1.4)">
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <polygon points="-10,-5 10,5 10,-5 -10,5 -10,-4" fill="white" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="0.0" r="2.0" fill="black" stroke="#000" stroke-width="1"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
  </g>

  <!-- ===================== LÉGENDE HP/BP ===================== -->
  <g transform="translate(40,20)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#c14a17" stroke-width="3"/>
    <text x="32" y="4" font-size="11" fill="#c14a17" font-weight="bold">HP</text>
    <line x1="60" y1="0" x2="86" y2="0" stroke="#1b3a63" stroke-width="3"/>
    <text x="92" y="4" font-size="11" fill="#1b3a63" font-weight="bold">BP</text>
  </g>

  <!-- ===================== ENCADRÉS EXPLICATIFS ===================== -->
  <rect x="40" y="440" width="360" height="66" rx="8" fill="#eef2f7" stroke="#1b3a63" stroke-width="1.2"/>
  <text x="220" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3a63">Surchauffe</text>
  <text x="220" y="476" text-anchor="middle" font-size="10" fill="#5d6b7c">= T mesurée − T° de saturation (BP)</text>
  <text x="220" y="492" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b3a63">attendu 5 à 10 K</text>

  <rect x="500" y="440" width="360" height="66" rx="8" fill="#f8ece4" stroke="#c14a17" stroke-width="1.2"/>
  <text x="680" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#c14a17">Sous-refroidissement</text>
  <text x="680" y="476" text-anchor="middle" font-size="10" fill="#5d6b7c">= T° de saturation (HP) − T mesurée</text>
  <text x="680" y="492" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c14a17">attendu 4 à 8 K</text>

</svg>
