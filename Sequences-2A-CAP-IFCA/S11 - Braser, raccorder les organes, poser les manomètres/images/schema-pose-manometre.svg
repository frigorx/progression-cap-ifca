<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Calibri, sans-serif">

  <!-- fond -->
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <!-- Titre -->
  <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b3a63">Pose et lecture d'un manomètre</text>
  <text x="450" y="44" text-anchor="middle" font-size="12" fill="#5d6b7c">Raccordement sur prise de pression — lecture pression / température</text>

  <!-- ===================== BLOC GAUCHE : MANOMÈTRE BP (bleu) ===================== -->
  <text x="185" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1b3a63">Manomètre BP</text>

  <!-- Cadran BP -->
  <g transform="translate(185,175)">
    <!-- ombre portée discrète -->
    <ellipse cx="0" cy="112" rx="66" ry="8" fill="#5d6b7c" opacity="0.15"/>

    <!-- boîtier rond -->
    <circle cx="0" cy="0" r="92" fill="#eef2f7" stroke="#1b3a63" stroke-width="3"/>
    <!-- anneau bleu -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="#1b3a63" stroke-width="6"/>
    <!-- verre / reflet plat -->
    <path d="M -60,-60 A 84,84 0 0 1 60,-70" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.35" stroke-linecap="round"/>

    <!-- cadran blanc -->
    <circle cx="0" cy="0" r="76" fill="#ffffff" stroke="#20262f" stroke-width="1.5"/>

    <!-- échelle extérieure : pression (bar) -->
    <g stroke="#1b3a63" stroke-width="1.5">
      <line x1="0" y1="-70" x2="0" y2="-62"/>
      <line x1="34.7" y1="-59.3" x2="30.4" y2="-52.4"/>
      <line x1="60.6" y1="-35" x2="52.5" y2="-30.3"/>
      <line x1="70" y1="0" x2="61.3" y2="0"/>
      <line x1="60.6" y1="35" x2="52.5" y2="30.3"/>
      <line x1="34.7" y1="59.3" x2="30.4" y2="52.4"/>
      <line x1="0" y1="70" x2="0" y2="62"/>
      <line x1="-34.7" y1="59.3" x2="-30.4" y2="52.4"/>
      <line x1="-60.6" y1="35" x2="-52.5" y2="30.3"/>
      <line x1="-70" y1="0" x2="-61.3" y2="0"/>
      <line x1="-60.6" y1="-35" x2="-52.5" y2="-30.3"/>
      <line x1="-34.7" y1="-59.3" x2="-30.4" y2="-52.4"/>
    </g>
    <text x="0" y="-76" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">0</text>
    <text x="46" y="-68" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">2</text>
    <text x="80" y="-38" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">4</text>
    <text x="86" y="4" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">6</text>
    <text x="80" y="46" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">8</text>
    <text x="46" y="76" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">10</text>
    <text x="0" y="90" text-anchor="middle" font-size="9" fill="#1b3a63" font-weight="bold">12</text>

    <!-- échelle intérieure : température °C (fluide) -->
    <g stroke="#c14a17" stroke-width="1" opacity="0.85">
      <line x1="0" y1="-52" x2="0" y2="-46"/>
      <line x1="26" y1="-45" x2="22.5" y2="-39.6"/>
      <line x1="45" y1="-26" x2="39" y2="-22.5"/>
      <line x1="52" y1="0" x2="46" y2="0"/>
      <line x1="45" y1="26" x2="39" y2="22.5"/>
      <line x1="0" y1="52" x2="0" y2="46"/>
      <line x1="-45" y1="26" x2="-39" y2="22.5"/>
      <line x1="-52" y1="0" x2="-46" y2="0"/>
      <line x1="-45" y1="-26" x2="-39" y2="-22.5"/>
    </g>
    <text x="0" y="-38" text-anchor="middle" font-size="7.5" fill="#c14a17">-30</text>
    <text x="30" y="-30" text-anchor="middle" font-size="7.5" fill="#c14a17">-15</text>
    <text x="40" y="14" text-anchor="middle" font-size="7.5" fill="#c14a17">0</text>
    <text x="30" y="42" text-anchor="middle" font-size="7.5" fill="#c14a17">10</text>
    <text x="-40" y="14" text-anchor="middle" font-size="7.5" fill="#c14a17">-40</text>

    <!-- libellés d'échelle -->
    <text x="0" y="-104" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1b3a63">bar</text>
    <text x="0" y="24" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#c14a17">°C (R410A)</text>

    <!-- aiguille -->
    <g transform="rotate(55)">
      <polygon points="0,-58 3,6 -3,6" fill="#20262f"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#20262f"/>

    <!-- logo/marque discret -->
    <text x="0" y="-14" text-anchor="middle" font-size="7" fill="#5d6b7c">BP</text>

    <!-- raccord fileté en bas -->
    <rect x="-8" y="76" width="16" height="20" fill="#5d6b7c" stroke="#20262f" stroke-width="1"/>
    <line x1="-8" y1="82" x2="8" y2="82" stroke="#20262f" stroke-width="0.8"/>
    <line x1="-8" y1="88" x2="8" y2="88" stroke="#20262f" stroke-width="0.8"/>
    <line x1="-8" y1="94" x2="8" y2="94" stroke="#20262f" stroke-width="0.8"/>
  </g>
  <text x="185" y="308" text-anchor="middle" font-size="12" fill="#1b3a63" font-weight="bold">manomètre BP</text>
  <text x="185" y="323" text-anchor="middle" font-size="10" fill="#5d6b7c">anneau et cadran bleus</text>

  <!-- flexible BP vers la prise de pression -->
  <path d="M 185 296 q -10 20 0 34 t 0 34" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/>
  <path d="M 185 296 L 185 300" fill="none" stroke="#1b3a63" stroke-width="4"/>
  <path d="M 175 364 L 130 380" fill="none" stroke="#1b3a63" stroke-width="4" stroke-linecap="round"/>

  <!-- ===================== BLOC DROIT : MANOMÈTRE HP (rouge/rouille) ===================== -->
  <text x="715" y="70" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#c14a17">Manomètre HP</text>

  <g transform="translate(715,175)">
    <ellipse cx="0" cy="112" rx="66" ry="8" fill="#5d6b7c" opacity="0.15"/>

    <circle cx="0" cy="0" r="92" fill="#f8ece4" stroke="#c14a17" stroke-width="3"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#c14a17" stroke-width="6"/>
    <path d="M -60,-60 A 84,84 0 0 1 60,-70" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.35" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="76" fill="#ffffff" stroke="#20262f" stroke-width="1.5"/>

    <!-- échelle extérieure : pression (bar), plage plus large -->
    <g stroke="#c14a17" stroke-width="1.5">
      <line x1="0" y1="-70" x2="0" y2="-62"/>
      <line x1="34.7" y1="-59.3" x2="30.4" y2="-52.4"/>
      <line x1="60.6" y1="-35" x2="52.5" y2="-30.3"/>
      <line x1="70" y1="0" x2="61.3" y2="0"/>
      <line x1="60.6" y1="35" x2="52.5" y2="30.3"/>
      <line x1="34.7" y1="59.3" x2="30.4" y2="52.4"/>
      <line x1="0" y1="70" x2="0" y2="62"/>
      <line x1="-34.7" y1="59.3" x2="-30.4" y2="52.4"/>
      <line x1="-60.6" y1="35" x2="-52.5" y2="30.3"/>
      <line x1="-70" y1="0" x2="-61.3" y2="0"/>
      <line x1="-60.6" y1="-35" x2="-52.5" y2="-30.3"/>
      <line x1="-34.7" y1="-59.3" x2="-30.4" y2="-52.4"/>
    </g>
    <text x="0" y="-76" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">0</text>
    <text x="46" y="-68" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">10</text>
    <text x="80" y="-38" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">20</text>
    <text x="86" y="4" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">30</text>
    <text x="80" y="46" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">40</text>
    <text x="46" y="76" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">50</text>
    <text x="0" y="90" text-anchor="middle" font-size="9" fill="#c14a17" font-weight="bold">60</text>

    <!-- échelle intérieure : température °C (fluide) -->
    <g stroke="#1b3a63" stroke-width="1" opacity="0.85">
      <line x1="0" y1="-52" x2="0" y2="-46"/>
      <line x1="26" y1="-45" x2="22.5" y2="-39.6"/>
      <line x1="45" y1="-26" x2="39" y2="-22.5"/>
      <line x1="52" y1="0" x2="46" y2="0"/>
      <line x1="45" y1="26" x2="39" y2="22.5"/>
      <line x1="0" y1="52" x2="0" y2="46"/>
      <line x1="-45" y1="26" x2="-39" y2="22.5"/>
      <line x1="-52" y1="0" x2="-46" y2="0"/>
      <line x1="-45" y1="-26" x2="-39" y2="-22.5"/>
    </g>
    <text x="0" y="-38" text-anchor="middle" font-size="7.5" fill="#1b3a63">10</text>
    <text x="30" y="-30" text-anchor="middle" font-size="7.5" fill="#1b3a63">25</text>
    <text x="40" y="14" text-anchor="middle" font-size="7.5" fill="#1b3a63">40</text>
    <text x="30" y="42" text-anchor="middle" font-size="7.5" fill="#1b3a63">50</text>
    <text x="-40" y="14" text-anchor="middle" font-size="7.5" fill="#1b3a63">55</text>

    <text x="0" y="-104" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#c14a17">bar</text>
    <text x="0" y="24" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1b3a63">°C (R410A)</text>

    <!-- aiguille -->
    <g transform="rotate(75)">
      <polygon points="0,-58 3,6 -3,6" fill="#20262f"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#20262f"/>

    <text x="0" y="-14" text-anchor="middle" font-size="7" fill="#5d6b7c">HP</text>

    <!-- raccord fileté en bas -->
    <rect x="-8" y="76" width="16" height="20" fill="#5d6b7c" stroke="#20262f" stroke-width="1"/>
    <line x1="-8" y1="82" x2="8" y2="82" stroke="#20262f" stroke-width="0.8"/>
    <line x1="-8" y1="88" x2="8" y2="88" stroke="#20262f" stroke-width="0.8"/>
    <line x1="-8" y1="94" x2="8" y2="94" stroke="#20262f" stroke-width="0.8"/>
  </g>
  <text x="715" y="308" text-anchor="middle" font-size="12" fill="#c14a17" font-weight="bold">manomètre HP</text>
  <text x="715" y="323" text-anchor="middle" font-size="10" fill="#5d6b7c">anneau et cadran rouge/rouille</text>

  <!-- flexible HP vers la prise de pression -->
  <path d="M 715 296 q 10 20 0 34 t 0 34" fill="none" stroke="#c14a17" stroke-width="4" stroke-linecap="round"/>
  <path d="M 725 364 L 770 380" fill="none" stroke="#c14a17" stroke-width="4" stroke-linecap="round"/>

  <!-- ===================== TUBE CUIVRE + PRISE DE PRESSION (vanne_isolement) ===================== -->
  <line x1="30" y1="392" x2="870" y2="392" stroke="#c14a17" stroke-width="5" stroke-linecap="round"/>
  <text x="30" y="414" font-size="10.5" fill="#5d6b7c">tube cuivre (ligne HP/BP en service)</text>

  <!-- prise BP (gauche) -->
  <g transform="translate(130,392) scale(1.7)">
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <polygon points="-10,-5 10,5 10,-5 -10,5 -10,-4" fill="white" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="0.0" r="2.0" fill="black" stroke="#000" stroke-width="1"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
  </g>

  <!-- prise HP (droite) -->
  <g transform="translate(770,392) scale(1.7)">
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <polygon points="-10,-5 10,5 10,-5 -10,5 -10,-4" fill="white" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="0.0" r="2.0" fill="black" stroke="#000" stroke-width="1"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
  </g>

  <rect x="50" y="422" width="160" height="30" rx="6" fill="#eef2f7" stroke="#1b3a63" stroke-width="1"/>
  <text x="130" y="441" text-anchor="middle" font-size="10" fill="#1b3a63" font-weight="bold">prise de pression</text>
  <text x="130" y="453" text-anchor="middle" font-size="8.5" fill="#5d6b7c">(vanne de service / Schrader)</text>

  <rect x="690" y="422" width="160" height="30" rx="6" fill="#f8ece4" stroke="#c14a17" stroke-width="1"/>
  <text x="770" y="441" text-anchor="middle" font-size="10" fill="#c14a17" font-weight="bold">prise de pression</text>
  <text x="770" y="453" text-anchor="middle" font-size="8.5" fill="#5d6b7c">(vanne de service / Schrader)</text>

  <!-- ===================== BANDEAU ANNOTATION CENTRAL ===================== -->
  <rect x="290" y="70" width="320" height="52" rx="8" fill="#eef2f7" stroke="#1b3a63" stroke-width="1"/>
  <text x="450" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1b3a63">lecture : pression → température</text>
  <text x="450" y="105" text-anchor="middle" font-size="10" fill="#5d6b7c">(échelle du fluide, cadran intérieur)</text>
  <text x="450" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c14a17">on ne force jamais le raccord</text>

</svg>
