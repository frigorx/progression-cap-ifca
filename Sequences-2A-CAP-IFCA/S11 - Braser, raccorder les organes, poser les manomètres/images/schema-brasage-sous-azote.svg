<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Calibri, sans-serif">

  <!-- fond -->
  <rect x="0" y="0" width="900" height="360" fill="#ffffff"/>

  <!-- Titre -->
  <text x="450" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b3a63">Brasage sous azote</text>
  <text x="450" y="44" text-anchor="middle" font-size="12" fill="#5d6b7c">Procédure de balayage — protection contre l'oxydation interne du tube</text>

  <!-- ===================== BOUTEILLE D'AZOTE INDUSTRIEL (illustration vectorielle plate) ===================== -->
  <!-- Corps gris foncé, ogive noire (repère normalisé azote), robinet + volant en haut, sortie à droite -->
  <g transform="translate(110,150)">
    <!-- ombre portée discrète au sol -->
    <ellipse cx="0" cy="123" rx="34" ry="6" fill="#5d6b7c" opacity="0.18"/>

    <!-- anneau / base de pied -->
    <rect x="-30" y="110" width="60" height="14" rx="4" fill="#3a4552" stroke="#232a33" stroke-width="1.5"/>
    <rect x="-24" y="104" width="48" height="10" rx="3" fill="#4a5563" stroke="#232a33" stroke-width="1"/>

    <!-- corps cylindrique -->
    <rect x="-26" y="-40" width="52" height="146" rx="10" fill="#2f3742" stroke="#20262f" stroke-width="1.5"/>
    <!-- ombre discrète (aplat unique, pas de dégradé) sur le flanc droit -->
    <path d="M 10,-38 L 22,-36 A 12,12 0 0 1 26,-28 L 26,102 A 8,8 0 0 1 20,110 L 12,106 Z" fill="#232a33" opacity="0.55"/>
    <!-- reflet plat sur le flanc gauche -->
    <rect x="-20" y="-30" width="6" height="128" rx="3" fill="#4a5563" opacity="0.5"/>

    <!-- bandeau d'étiquette clair -->
    <rect x="-26" y="18" width="52" height="46" fill="#eef2f7" stroke="#20262f" stroke-width="1"/>
    <text x="0" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b3a63">N₂</text>
    <text x="0" y="55" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f3742" letter-spacing="0.5">AZOTE</text>
    <text x="0" y="90" text-anchor="middle" font-size="6" fill="#5d6b7c">gaz inerte · sous pression</text>

    <!-- épaules arrondies -->
    <path d="M -26,-40 A 26,22 0 0 1 26,-40 L 26,-52 L -26,-52 Z" fill="#2f3742" stroke="#20262f" stroke-width="1.5"/>

    <!-- ogive noire (repère normalisé azote) -->
    <path d="M -20,-52 A 20,34 0 0 1 20,-52 L 18,-66 A 18,30 0 0 0 -18,-66 Z" fill="#111418" stroke="#000" stroke-width="1.2"/>
    <path d="M -18,-66 A 18,30 0 0 1 18,-66 L 11,-86 A 11,18 0 0 0 -11,-86 Z" fill="#111418" stroke="#000" stroke-width="1.2"/>

    <!-- collerette / chapeau de protection au col -->
    <rect x="-14" y="-92" width="28" height="9" rx="2" fill="#4a5563" stroke="#20262f" stroke-width="1"/>

    <!-- robinet -->
    <rect x="-6" y="-100" width="12" height="10" rx="2" fill="#5d6b7c" stroke="#20262f" stroke-width="1"/>
    <!-- volant du robinet -->
    <circle cx="0" cy="-108" r="9" fill="none" stroke="#5d6b7c" stroke-width="3.2"/>
    <circle cx="0" cy="-108" r="2" fill="#5d6b7c"/>

    <!-- sortie du robinet orientée à droite, vers le tube -->
    <path d="M -6,-95 L 30,-95 L 30,-90" fill="none" stroke="#5d6b7c" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <text x="110" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b3a63">AZOTE</text>
  <text x="110" y="303" text-anchor="middle" font-size="11" fill="#5d6b7c">bouteille N₂</text>

  <!-- conduite bouteille -> détendeur/robinet (sortie robinet à x=140,y=60 ; descend puis rejoint le port gauche du détendeur à x=212,y=245) -->
  <path d="M 140 60 L 190 60 L 190 245 L 212 245" fill="none" stroke="#5d6b7c" stroke-width="2.5"/>
  <polygon points="205,245 193,239 193,251" fill="#5d6b7c"/>

  <!-- ===================== DÉTENDEUR / ROBINET (vanne_isolement) ===================== -->
  <!-- viewBox -19 -10 40 20, ports (-11,0) et (11,0) -->
  <g transform="translate(230,245) scale(1.6)">
    <line x1="10" y1="0" x2="11" y2="0" stroke="#000" stroke-width="1"/>
    <line x1="-10" y1="0" x2="-11" y2="0" stroke="#000" stroke-width="1"/>
    <polygon points="-10,-5 10,5 10,-5 -10,5 -10,-4" fill="white" stroke="#000" stroke-width="1"/>
    <circle cx="0.0" cy="0.0" r="2.0" fill="black" stroke="#000" stroke-width="1"/>
    <circle cx="11" cy="0" r="1.5" fill="#000"/>
    <circle cx="-11" cy="0" r="1.5" fill="#000"/>
  </g>
  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#5d6b7c">détendeur / robinet</text>

  <!-- tube souple (ondulé) vers l'entrée du tube cuivre à braser -->
  <path d="M 264 245 q 15 -10 30 0 t 30 0 t 30 0 t 30 0" fill="none" stroke="#5d6b7c" stroke-width="2.5"/>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="#5d6b7c">tube souple</text>

  <!-- ===================== TUBE CUIVRE À BRASER (traversée de l'azote) ===================== -->
  <!-- Tube représenté en trait fort cuivré, entrée à gauche, sortie à droite -->
  <path d="M 414 245 L 780 245" fill="none" stroke="#c14a17" stroke-width="6" stroke-linecap="round"/>
  <text x="420" y="270" font-size="11" fill="#1b3a63" font-weight="bold">entrée azote</text>
  <polygon points="440,245 428,239 428,251" fill="#1b3a63"/>

  <!-- flèche d'entrée dans le tube -->
  <polygon points="418,245 406,239 406,251" fill="#1b3a63"/>

  <!-- Point de brasure : raccord + flamme -->
  <g transform="translate(560,245)">
    <!-- manchon / raccord (représentation simple du tube, cohérent avec le tube cuivré) -->
    <rect x="-14" y="-9" width="28" height="18" fill="#f3ded1" stroke="#c14a17" stroke-width="2"/>
  </g>

  <!-- Flamme stylisée -- élément dessiné à la main, PAS un symbole normalisé de la bibliothèque -->
  <g transform="translate(560,190)">
    <path d="M 0,-38 C 10,-26 14,-16 8,-6 C 12,-10 16,-6 14,2 C 12,10 2,14 -4,10 C -12,6 -14,-4 -8,-12 C -14,-8 -14,-18 -6,-24 C -8,-18 -2,-20 0,-38 Z"
          fill="#ff6b35" stroke="#c14a17" stroke-width="1.2"/>
    <path d="M 0,-8 C 3,-2 4,3 0,6 C -4,3 -3,-2 0,-8 Z" fill="#ffe0b0" stroke="none"/>
  </g>
  <line x1="560" y1="205" x2="560" y2="236" stroke="#5d6b7c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="560" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c14a17">point de brasage</text>

  <!-- flèche sortie azote -->
  <polygon points="740,245 728,239 728,251" fill="#1b3a63"/>
  <path d="M 780 245 L 820 245" fill="none" stroke="#1b3a63" stroke-width="2.5"/>
  <polygon points="815,245 803,239 803,251" fill="#1b3a63"/>
  <text x="855" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3a63">sortie</text>
  <text x="855" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b3a63">azote</text>

  <!-- annotations -->
  <text x="855" y="272" text-anchor="middle" font-size="9.5" fill="#5d6b7c">faible débit</text>
  <text x="855" y="284" text-anchor="middle" font-size="9.5" fill="#5d6b7c">continu</text>

  <!-- bandeau annotation principale -->
  <rect x="330" y="300" width="440" height="40" rx="8" fill="#eef2f7" stroke="#1b3a63" stroke-width="1"/>
  <text x="550" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b3a63">Balayage d'azote = pas d'oxydation interne</text>
  <text x="550" y="333" text-anchor="middle" font-size="10.5" fill="#5d6b7c">le débit doit rester faible et continu pendant toute la durée du brasage</text>

</svg>
