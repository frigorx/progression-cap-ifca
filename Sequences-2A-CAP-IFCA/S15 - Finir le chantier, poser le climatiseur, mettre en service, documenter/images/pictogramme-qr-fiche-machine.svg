<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, sans-serif">
  <!-- Fiche machine (gauche) -->
  <rect x="20" y="20" width="300" height="270" rx="8" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <rect x="20" y="20" width="300" height="34" rx="8" fill="#1b3a63"/>
  <text x="170" y="43" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">FICHE MACHINE</text>

  <text x="36" y="76" font-size="11.5" fill="#5d6b7c" font-weight="bold">Repère de l'installation</text>
  <line x1="36" y1="84" x2="304" y2="84" stroke="#d8dee6" stroke-width="1.5"/>

  <text x="36" y="108" font-size="11.5" fill="#5d6b7c" font-weight="bold">Fluide frigorigène · charge (kg)</text>
  <line x1="36" y1="116" x2="304" y2="116" stroke="#d8dee6" stroke-width="1.5"/>

  <text x="36" y="140" font-size="11.5" fill="#5d6b7c" font-weight="bold">Organes (compresseur, détendeur…)</text>
  <line x1="36" y1="148" x2="304" y2="148" stroke="#d8dee6" stroke-width="1.5"/>

  <text x="36" y="172" font-size="11.5" fill="#5d6b7c" font-weight="bold">Réglages (pressostats, consigne)</text>
  <line x1="36" y1="180" x2="304" y2="180" stroke="#d8dee6" stroke-width="1.5"/>

  <text x="36" y="204" font-size="11.5" fill="#5d6b7c" font-weight="bold">Historique des interventions</text>
  <line x1="36" y1="212" x2="304" y2="212" stroke="#d8dee6" stroke-width="1.5"/>

  <!-- QR pictogram sur la fiche -->
  <g transform="translate(220,224)">
    <rect x="0" y="0" width="70" height="70" fill="#f5f8fc" stroke="#ff6b35" stroke-width="1.5"/>
    <rect x="6" y="6" width="18" height="18" fill="none" stroke="#22303f" stroke-width="3"/>
    <rect x="46" y="6" width="18" height="18" fill="none" stroke="#22303f" stroke-width="3"/>
    <rect x="6" y="46" width="18" height="18" fill="none" stroke="#22303f" stroke-width="3"/>
    <rect x="11" y="11" width="8" height="8" fill="#22303f"/>
    <rect x="51" y="11" width="8" height="8" fill="#22303f"/>
    <rect x="11" y="51" width="8" height="8" fill="#22303f"/>
    <rect x="30" y="6" width="6" height="6" fill="#22303f"/>
    <rect x="38" y="16" width="6" height="6" fill="#22303f"/>
    <rect x="30" y="30" width="6" height="6" fill="#22303f"/>
    <rect x="46" y="30" width="6" height="6" fill="#22303f"/>
    <rect x="30" y="46" width="6" height="6" fill="#22303f"/>
    <rect x="38" y="56" width="6" height="6" fill="#22303f"/>
    <rect x="54" y="54" width="6" height="6" fill="#22303f"/>
  </g>
  <text x="36" y="232" font-size="10.5" fill="#c14a17" font-style="italic">étiquette QR</text>

  <!-- Flèche -->
  <defs>
    <marker id="f2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff6b35"/>
    </marker>
  </defs>
  <line x1="330" y1="150" x2="410" y2="150" stroke="#ff6b35" stroke-width="2.5" marker-end="url(#f2)"/>
  <text x="370" y="140" font-size="10.5" fill="#5d6b7c" text-anchor="middle">on scanne</text>

  <!-- Fiche numérique (droite) -->
  <rect x="420" y="60" width="280" height="180" rx="10" fill="#fff7f3" stroke="#ff6b35" stroke-width="2"/>
  <text x="560" y="88" font-size="13" fill="#c14a17" font-weight="bold" text-anchor="middle">FICHE NUMÉRIQUE</text>
  <text x="560" y="106" font-size="11" fill="#5d6b7c" text-anchor="middle">inerWeb — hors ligne</text>
  <line x1="440" y1="118" x2="680" y2="118" stroke="#e3cf6b" stroke-width="1.5"/>
  <text x="440" y="140" font-size="11" fill="#22303f">— Historique complet de la machine</text>
  <text x="440" y="160" font-size="11" fill="#22303f">— Relevés de mise en service</text>
  <text x="440" y="180" font-size="11" fill="#22303f">— Dernière intervention</text>
  <text x="440" y="200" font-size="11" fill="#22303f">— Consultable sans connexion internet</text>
  <text x="560" y="290" font-size="10" fill="#9aa5b1" text-anchor="middle" font-style="italic">pictogramme schématique — pas un code scannable réel</text>
</svg>
