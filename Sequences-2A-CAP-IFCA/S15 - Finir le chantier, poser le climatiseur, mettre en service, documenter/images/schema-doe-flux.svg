<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b3a63"/>
    </marker>
  </defs>

  <!-- Ligne 1 : AVANT LES TRAVAUX -->
  <text x="20" y="26" font-size="13" font-weight="bold" fill="#5d6b7c" letter-spacing="1">AVANT LE DÉBUT DES TRAVAUX</text>
  <rect x="20" y="40" width="200" height="60" rx="8" fill="#f5f8fc" stroke="#1b3a63" stroke-width="2"/>
  <text x="120" y="66" font-size="13.5" fill="#1b3a63" font-weight="bold" text-anchor="middle">Maîtrise</text>
  <text x="120" y="83" font-size="13.5" fill="#1b3a63" font-weight="bold" text-anchor="middle">d'ouvrage</text>

  <line x1="220" y1="70" x2="360" y2="70" stroke="#1b3a63" stroke-width="2.5" marker-end="url(#fleche)"/>
  <text x="290" y="60" font-size="11.5" fill="#5d6b7c" text-anchor="middle">remet le DOE existant</text>

  <rect x="360" y="40" width="220" height="60" rx="8" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <text x="470" y="66" font-size="13.5" fill="#1b3a63" font-weight="bold" text-anchor="middle">Entreprise</text>
  <text x="470" y="83" font-size="13.5" fill="#1b3a63" font-weight="bold" text-anchor="middle">titulaire du marché</text>

  <!-- Ligne 2 : APRES RECEPTION -->
  <text x="20" y="150" font-size="13" font-weight="bold" fill="#5d6b7c" letter-spacing="1">APRÈS LA RÉCEPTION DES TRAVAUX</text>
  <rect x="20" y="164" width="220" height="60" rx="8" fill="#fff" stroke="#ff6b35" stroke-width="2"/>
  <text x="130" y="190" font-size="13.5" fill="#c14a17" font-weight="bold" text-anchor="middle">Entreprise</text>
  <text x="130" y="207" font-size="13.5" fill="#c14a17" font-weight="bold" text-anchor="middle">exécutante des travaux</text>

  <line x1="240" y1="194" x2="380" y2="194" stroke="#ff6b35" stroke-width="2.5" marker-end="url(#fleche)"/>
  <text x="310" y="184" font-size="11.5" fill="#5d6b7c" text-anchor="middle">remet le DOE à jour</text>

  <rect x="380" y="164" width="220" height="60" rx="8" fill="#f5f8fc" stroke="#ff6b35" stroke-width="2"/>
  <text x="490" y="190" font-size="13.5" fill="#c14a17" font-weight="bold" text-anchor="middle">Maîtrise d'ouvrage</text>
  <text x="490" y="207" font-size="13.5" fill="#c14a17" font-weight="bold" text-anchor="middle">/ Client</text>

  <!-- Ligne 3 : usage -->
  <line x1="490" y1="224" x2="490" y2="260" stroke="#5d6b7c" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="330" y="260" width="320" height="60" rx="8" fill="#fff7f3" stroke="#5d6b7c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="490" y="284" font-size="12.5" fill="#22303f" text-anchor="middle" font-weight="bold">Archive conservée par le client</text>
  <text x="490" y="301" font-size="11.5" fill="#5d6b7c" text-anchor="middle">fonctionnement · maintenance · garantie</text>
</svg>
