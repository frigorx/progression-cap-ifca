<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Planche de travail : placer les quatre organes de la Croix du Frigoriste"
     style="width:100%; background:#fff; border:1px solid #d8dee6; border-radius:4px">
<title>Croix du Frigoriste — planche de travail de l'élève</title>
<desc>Réserve de quatre symboles à gauche, croix vierge à droite. L'élève redessine chaque
symbole dans la case qui convient, trace le sens de circulation et indique HP ou BP.
Les cases ne sont pas numérotées : un numéro suggérerait un ordre de parcours, or c'est
justement ce que l'élève doit trouver. La correction n'est pas sur cette planche.</desc>
<style>
  .t     { font-family:'Trebuchet MS',Arial,sans-serif; font-weight:bold; fill:#1b3a63 }
  .lib   { font-family:'Trebuchet MS',Arial,sans-serif; font-weight:bold; font-size:15px; fill:#1b3a63 }
  .rep   { font-family:'Trebuchet MS',Arial,sans-serif; font-weight:bold; font-size:17px; fill:#fff }
  .pos   { font-family:'Trebuchet MS',Arial,sans-serif; font-weight:bold; font-size:13px; fill:#1b3a63;
           letter-spacing:.08em }
  .cons  { font-family:Arial,sans-serif; font-size:12.5px; fill:#5d6b7c }
  .mini  { font-family:Arial,sans-serif; font-size:11px; fill:#5d6b7c }
  .trait { fill:none; stroke:#22303f; stroke-width:2.2 }        /* symboles : trait franc */
  .tube  { fill:none; stroke:#5d6b7c; stroke-width:2 }
  .case  { fill:#fff; stroke:#1b3a63; stroke-width:2; stroke-dasharray:7,5 }
  .resa  { fill:#fff; stroke:#d8dee6; stroke-width:1.5 }
  .past  { fill:#fff; stroke:#5d6b7c; stroke-width:1.8; stroke-dasharray:4,3 }
</style>

<!-- ================= TITRE ================= -->
<text x="450" y="26" text-anchor="middle" class="t" font-size="19">La Croix du Frigoriste — planche de travail</text>
<text x="450" y="46" text-anchor="middle" class="cons">Redessinez chaque symbole dans la case qui convient, puis tracez le sens de circulation du fluide.</text>

<!-- ================= RÉSERVE (colonne de gauche) ================= -->
<text x="22" y="76" class="lib" font-size="13">LES SYMBOLES À PLACER</text>
<line x1="22" y1="83" x2="212" y2="83" stroke="#ff6b35" stroke-width="2.5"/>

<!-- A : compresseur -->
<rect class="resa" x="22" y="94" width="190" height="128" rx="5"/>
<circle cx="40" cy="112" r="12" fill="#ff6b35"/><text x="40" y="118" text-anchor="middle" class="rep">A</text>
<circle class="trait" cx="88" cy="158" r="27"/>
<path class="trait" d="M77 143 L112 158 L77 173 Z" fill="#22303f"/>
<text x="124" y="152" class="lib" font-size="13">COMPRESSEUR</text>
<text x="124" y="169" class="mini">il pousse et comprime</text>
<text x="124" y="183" class="mini">la vapeur</text>

<!-- B : condenseur -->
<rect class="resa" x="22" y="230" width="190" height="128" rx="5"/>
<circle cx="40" cy="248" r="12" fill="#ff6b35"/><text x="40" y="254" text-anchor="middle" class="rep">B</text>
<path d="M62 274 l-4 8 h8 Z M80 274 l-4 8 h8 Z M98 274 l-4 8 h8 Z" fill="#22303f"/>
<path class="trait" d="M62 296 L62 284 M80 296 L80 284 M98 296 L98 284" stroke-width="1.8"/>
<rect class="trait" x="46" y="300" width="76" height="42"/>
<path class="trait" d="M60 300 L60 342 M74 300 L74 342 M88 300 L88 342 M102 300 L102 342"/>
<text x="132" y="298" class="lib" font-size="13">CONDENSEUR</text>
<text x="132" y="315" class="mini">la chaleur</text>
<text x="132" y="329" class="mini">s'en va</text>

<!-- C : détendeur -->
<rect class="resa" x="22" y="366" width="190" height="128" rx="5"/>
<circle cx="40" cy="384" r="12" fill="#ff6b35"/><text x="40" y="390" text-anchor="middle" class="rep">C</text>
<path class="trait" d="M58 408 L58 460 L98 434 Z" fill="#fff"/>
<path class="trait" d="M138 408 L138 460 L98 434 Z" fill="#fff"/>
<text x="150" y="428" class="lib" font-size="13">DÉ-</text>
<text x="150" y="444" class="lib" font-size="13">TENDEUR</text>
<text x="150" y="461" class="mini">la pression</text>
<text x="150" y="475" class="mini">chute</text>

<!-- D : évaporateur -->
<rect class="resa" x="22" y="502" width="190" height="128" rx="5"/>
<circle cx="40" cy="520" r="12" fill="#ff6b35"/><text x="40" y="526" text-anchor="middle" class="rep">D</text>
<path d="M62 538 l-4 -8 h8 Z M80 538 l-4 -8 h8 Z M98 538 l-4 -8 h8 Z" fill="#22303f"/>
<path class="trait" d="M62 538 L62 550 M80 538 L80 550 M98 538 L98 550" stroke-width="1.8"/>
<rect class="trait" x="46" y="554" width="76" height="42"/>
<path class="trait" d="M60 554 L60 596 M74 554 L74 596 M88 554 L88 596 M102 554 L102 596"/>
<text x="132" y="552" class="lib" font-size="13">ÉVAPO-</text>
<text x="132" y="569" class="lib" font-size="13">RATEUR</text>
<text x="132" y="586" class="mini">la chaleur</text>
<text x="132" y="600" class="mini">est absorbée</text>

<text x="22" y="654" class="mini">Attention : ces quatre symboles ne sont pas</text>
<text x="22" y="668" class="mini">rangés dans l'ordre de circulation du fluide.</text>

<!-- ================= LA CROIX VIERGE ================= -->
<text x="262" y="76" class="lib" font-size="13">LA CROIX À COMPLÉTER</text>
<line x1="262" y1="83" x2="878" y2="83" stroke="#ff6b35" stroke-width="2.5"/>

<!-- Le circuit : trait fin, sans flèche et sans couleur.
     Le sens et la distinction HP / BP sont le travail de l'élève. -->
<path class="tube" d="M400 210 L400 160 L570 160 M690 160 L860 160 L860 210"/>
<path class="tube" d="M860 330 L860 600 L690 600 M570 600 L400 600 L400 330"/>

<!-- Les quatre emplacements vides. Repérés par leur POSITION seulement :
     un numéro d'ordre soufflerait le sens de parcours. -->
<rect class="case" x="570" y="112" width="120" height="96" rx="6"/>
<text x="630" y="234" text-anchor="middle" class="pos">EN HAUT</text>

<rect class="case" x="570" y="552" width="120" height="96" rx="6"/>
<text x="630" y="674" text-anchor="middle" class="pos">EN BAS</text>

<rect class="case" x="340" y="332" width="120" height="96" rx="6"/>
<text x="400" y="454" text-anchor="middle" class="pos">À GAUCHE</text>

<rect class="case" x="800" y="332" width="120" height="96" rx="6"/>
<text x="860" y="454" text-anchor="middle" class="pos">À DROITE</text>

<!-- Pastilles HP / BP à remplir, une par branche -->
<rect class="past" x="452" y="132" width="66" height="32" rx="4"/>
<text x="485" y="180" text-anchor="middle" class="mini">HP ou BP ?</text>
<rect class="past" x="742" y="132" width="66" height="32" rx="4"/>
<text x="775" y="180" text-anchor="middle" class="mini">HP ou BP ?</text>
<rect class="past" x="452" y="628" width="66" height="32" rx="4"/>
<text x="485" y="622" text-anchor="middle" class="mini">HP ou BP ?</text>
<rect class="past" x="742" y="628" width="66" height="32" rx="4"/>
<text x="775" y="622" text-anchor="middle" class="mini">HP ou BP ?</text>

<!-- ================= CE QU'IL RESTE À FAIRE ================= -->
<line x1="262" y1="694" x2="878" y2="694" stroke="#d8dee6" stroke-width="1"/>
<text x="262" y="714" class="lib" font-size="13">CE QU'IL RESTE À FAIRE</text>
<text x="262" y="734" class="cons">1. Redessiner chacun des symboles A, B, C et D dans la case qui lui convient.</text>
<text x="262" y="752" class="cons">2. Tracer sur chaque tube une flèche donnant le sens de circulation du fluide.</text>
<text x="262" y="770" class="cons">3. Écrire HP ou BP dans chacun des quatre cadres en pointillé.</text>
<text x="262" y="788" class="cons">4. Repasser en trait fort toute la partie haute pression du circuit.</text>
</svg>
