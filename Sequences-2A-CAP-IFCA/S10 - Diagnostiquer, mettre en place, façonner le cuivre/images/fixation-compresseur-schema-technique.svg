<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" style="width:100%; background:#fff; border:1px solid #d8dee6; border-radius:4px">
<style>
  .lib{font-family:'Trebuchet MS',Arial,sans-serif; font-size:15px; font-weight:bold; fill:#1b3a63}
  .sub{font-family:Arial,sans-serif; font-size:12px; fill:#5d6b7c}
  .cote{font-family:Arial,sans-serif; font-size:11px; fill:#5d6b7c}
  .chassis{fill:#f5f8fc; stroke:#1b3a63; stroke-width:2}
  .boulon{fill:#fff; stroke:#ff6b35; stroke-width:2}
</style>
<text x="450" y="28" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1b3a63">Detail de fixation mecanique du compresseur sur chassis</text>

<!-- Chassis (vue de face) -->
<rect class="chassis" x="220" y="240" width="460" height="140"/>
<line x1="220" y1="260" x2="680" y2="260" stroke="#d8dee6" stroke-width="1"/>

<!-- Compresseur (symbole normalise, centre sur le chassis) -->
<g transform="translate(450,240) scale(4.6)"><circle cx="0.0" cy="0.0" r="15.0" fill="white" stroke="#000" stroke-width="1"/>
<line x1="-15" y1="0" x2="-16" y2="0" stroke="#000" stroke-width="1"/>
<line x1="15" y1="0" x2="16" y2="0" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="-13" x2="13" y2="-7" stroke="#000" stroke-width="1"/>
<line x1="-7" y1="13" x2="13" y2="7" stroke="#000" stroke-width="1"/>
<circle cx="-16" cy="0" r="1.5" fill="#000"/>
<circle cx="16" cy="0" r="1.5" fill="#000"/>
<circle cx="-10" cy="10" r="1.5" fill="#000"/>
<circle cx="2" cy="11" r="1.5" fill="#000"/>
<circle cx="2" cy="11" r="1.5" fill="#000"/>
<circle cx="-10" cy="-10" r="1.5" fill="#000"/></g>

<!-- 4 points de fixation (boulons) -->
<circle class="boulon" cx="260" cy="370" r="9"/>
<circle class="boulon" cx="640" cy="370" r="9"/>
<circle class="boulon" cx="260" cy="250" r="9"/>
<circle class="boulon" cx="640" cy="250" r="9"/>
<text class="cote" x="260" y="400" text-anchor="middle">Pt.1</text>
<text class="cote" x="640" y="400" text-anchor="middle">Pt.2</text>

<!-- Cotation largeur chassis -->
<line x1="220" y1="410" x2="680" y2="410" stroke="#5d6b7c" stroke-width="1"/>
<line x1="220" y1="404" x2="220" y2="416" stroke="#5d6b7c" stroke-width="1"/>
<line x1="680" y1="404" x2="680" y2="416" stroke="#5d6b7c" stroke-width="1"/>
<text class="cote" x="450" y="428" text-anchor="middle">entraxe selon supportage — a relever sur la machine confiee</text>

<!-- Niveau a bulle (schema simplifie) -->
<g transform="translate(760,300)">
  <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#fff" stroke="#1b3a63" stroke-width="2"/>
  <circle cx="0" cy="0" r="9" fill="none" stroke="#ff6b35" stroke-width="2"/>
  <circle cx="0" cy="0" r="2.5" fill="#ff6b35"/>
  <text class="cote" x="0" y="34" text-anchor="middle">niveau a bulle</text>
</g>

<!-- Legende / consigne -->
<rect x="60" y="60" width="300" height="70" rx="4" fill="#f5f8fc" stroke="#d8dee6"/>
<text class="sub" x="75" y="82">1. Positionner le compresseur au centre</text>
<text class="sub" x="75" y="100">2. Fixer les 4 points, serrage au couple</text>
<text class="sub" x="75" y="118">   selon la notice — a faire valider</text>

<text class="lib" x="450" y="450" text-anchor="middle">COMPRESSEUR fixe sur chassis — 4 points de fixation controles</text>
</svg>